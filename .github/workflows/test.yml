# 每次推送和 PR 自动跑后端测试和前端检查。
# shortcut: 后端测试用的是内存 SQLite（tests/conftest.py），线上是 PostgreSQL；SQLite 不检查字段长度，
# 这类问题这里发现不了。要补上时：conftest 支持从环境变量读测试库地址，再在这里加一个 postgres 服务。
name: test
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build  # 含类型检查（vue-tsc）
      - run: npm run check:ui
      - run: npm run test:logic
