services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ukcn
      POSTGRES_USER: ukcn
      POSTGRES_PASSWORD: ukcn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukcn -d ukcn"]
      interval: 10s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://ukcn:ukcn@db:5432/ukcn
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
