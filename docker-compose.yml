services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ukcn
      POSTGRES_USER: ukcn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ukcn}
    # 不对外开放 5432：数据库只给 api 容器用。需要本机连接时临时加上 ports 即可。
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukcn -d ukcn"]
      interval: 10s
      retries: 5
  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://ukcn:${POSTGRES_PASSWORD:-ukcn}@db:5432/ukcn
      # 请求都经过下面的 web（nginx）：不设的话所有用户算同一个来源，全站每小时只能注册 5 个号
      TRUST_PROXY: "true"
      # sitemap、canonical、分享卡片里的绝对链接（app/api/v1/seo.py）。换域名时在 .env 里设 PUBLIC_BASE_URL
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://haiwai.co.uk}
    depends_on:
      db:
        condition: service_healthy
    # 只绑本机：对外的入口是 web。直接对外开放的话，别人可以绕过 nginx 伪造 X-Forwarded-For，躲开登录限流
    ports:
      - "127.0.0.1:8000:8000"
    # 用户上传的图片 / 视频（没配对象存储时存在这里）。不挂卷的话重建容器就全丢了。
    volumes:
      - uploads:/srv/data/uploads
    restart: unless-stopped
  # 对外入口：前端页面 + 把 /api 转给 api（web/nginx.conf）。没配 HTTPS，证书请在它前面再加一层。
  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped
  # 每天伦敦时间 8 点抓 GOV.UK 资讯、AI 写成中文稿进「待审核」。单独一个进程，api 的多个 worker 不会重复调用 AI。
  news:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://ukcn:${POSTGRES_PASSWORD:-ukcn}@db:5432/ukcn
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started  # api 启动时先做数据库迁移
    command: ["python", "-m", "app.news", "--daily"]
    restart: unless-stopped

  # 每天把数据库完整备份一份到 backups 卷，保留 14 天。彻底删除等操作不可恢复，出错时只能靠它。
  # 恢复：docker compose exec backup pg_restore -h db -U ukcn -d ukcn --clean /backups/<文件名>
  # 备份和数据库在同一台机器上，机器坏了会一起丢：请定期把 backups 卷里的文件拷到别处。
  backup:
    image: postgis/postgis:16-3.4
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-ukcn}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          # 先写到临时文件，成功了才改名：备份失败不会留下一个看着正常、其实不完整的文件
          pg_dump -h db -U ukcn -Fc -f /backups/latest.partial ukcn && mv /backups/latest.partial "/backups/ukcn-$$(date +%Y%m%d-%H%M).dump"
          find /backups -name "ukcn-*.dump" -mtime +14 -delete
          sleep 86400
        done
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  backups:
