# 生产环境的入口：提供前端页面，把 /api 转给 api 容器。docker compose 的 web 服务用它。
# 没有配 HTTPS：证书和域名因部署而异，请在这台机器前面再放一层（云厂商的负载均衡 / Caddy / certbot）。
server {
    listen 80;

    # 视频上限 100MB（app/api/v1/uploads.py 的 LIMITS），留一点余量
    client_max_body_size 110m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # 覆盖而不是追加：后端在 TRUST_PROXY=true 时取 X-Forwarded-For 最右边一项，
        # 这里只放 nginx 亲眼看到的对端地址，客户端自己写的值带不进去。
        # 前面还有 CDN / 负载均衡时，要先用 real_ip 模块还原真实客户端 IP（见 .env.example）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;  # 上传边收边转，不先在 nginx 落一遍盘
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;  # 前端路由（/content/xxx 等）都回到 index.html
    }
}
