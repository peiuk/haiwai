# 生产环境的入口：提供前端页面，把 /api 转给 api 容器。docker compose 的 web 服务用它。
# 没有配 HTTPS：证书和域名因部署而异，请在这台机器前面再放一层（云厂商的负载均衡 / Caddy / certbot）。
server {
    listen 80;

    # 视频上限 100MB（app/api/v1/uploads.py 的 LIMITS），留一点余量
    client_max_body_size 110m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # 覆盖而不是追加：后端在 TRUST_PROXY=true 时取 X-Forwarded-For 最右边一项，
        # 这里只放 nginx 亲眼看到的对端地址，客户端自己写的值带不进去。
        # 前面还有 CDN / 负载均衡时，要先用 real_ip 模块还原真实客户端 IP（见 .env.example）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;  # 上传边收边转，不先在 nginx 落一遍盘
        proxy_read_timeout 300s;
    }

    # SEO：robots.txt / sitemap.xml 由后端按数据库生成（app/api/v1/seo.py）
    location = /robots.txt {
        proxy_pass http://api:8000/api/v1/seo/robots.txt;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://api:8000/api/v1/seo/sitemap.xml;
        proxy_set_header Host $host;
    }
    # index.html 里的 SSI include 来这里取当前页面的 <title>、描述和分享卡片；只给 nginx 内部用
    location /__seo/ {
        internal;
        proxy_pass http://api:8000/api/v1/seo/head/;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";  # 片段要原样拼进页面，不能是压缩过的
        proxy_read_timeout 3s;  # 后端慢 / 挂了就用 index.html 里的默认标题，页面照常打开
    }

    # 构建产物文件名带内容哈希，内容变了文件名就变：可以放心长期缓存
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        ssi on;  # 只处理 text/html，也就是 index.html
        try_files $uri /index.html;  # 前端路由（/content/xxx 等）都回到 index.html
        # 每次都向服务器确认：不然浏览器拿缓存的旧 index.html，更新后还在用旧版前端
        add_header Cache-Control "no-cache";
    }
}
