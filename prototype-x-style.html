  if(discoveryCategoryButton){discoveryCategoryFilter=discoveryCategoryButton.dataset.discoveryCategory;renderPage();return;}
  const favFilterButton=e.target.closest('[data-fav-filter]');
  if(favFilterButton){favoriteFilter=favFilterButton.dataset.favFilter;renderPage();return;}
  const allRead=e.target.closest('[data-notif-allread]');
  if(allRead){notifications.forEach(n=>n.unread=false);UKCN.save();renderAll();toast('已全部标记为已读');return;}
  const muteRoom=e.target.closest('[data-room-mute]');
  if(muteRoom){const room=muteRoom.dataset.roomMute;if(mutedRooms.has(room))mutedRooms.delete(room);else mutedRooms.add(room);persist();renderPage();toast(mutedRooms.has(room)?'已关闭此房间更新提醒':'已开启此房间更新提醒');return;}
  const notif=e.target.closest('[data-notif-open]');
  if(notif){const n=notifications.find(x=>x.id===notif.dataset.notifOpen);if(n){n.unread=false;UKCN.save();renderAll();toast('通知已标记为已读');}return;}
  const setBtn = e.target.closest('[data-settings]');
  if(setBtn){ settingsOpen = !settingsOpen; renderAll(); return; }
  /* §30 · 顶部搜索：搜索按钮 / 清除 / #关键词 / @用户名 / 热门关键词 */
  const sb = e.target.closest('[data-search]');
  if(sb){ const inp=$('#searchInput'); commitSearch(inp?inp.value:''); return; }
  const sc = e.target.closest('[data-clearsearch]');
  if(sc){ clearSearch(); return; }
  const sk = e.target.closest('[data-search-key]');
  if(sk){ e.preventDefault(); commitSearch('#'+sk.dataset.searchKey); return; }
  const su = e.target.closest('[data-search-user]');
  if(su){ e.preventDefault(); commitSearch('@'+su.dataset.searchUser); return; }
  const hk = e.target.closest('[data-hotkey]');
  if(hk){ commitSearch('#'+hk.dataset.hotkey); return; }
  const loc = e.target.closest('[data-loc]');
  if(loc){
    const a = loc.dataset.loc;
    if(a==='confirm'){
      locStage='confirmed'; locLocked=true;
      discoveryScope='auto'; discoveryCategoryFilter='all';
      setCountry(detectedRegion);
      composeDraft.cityTopicDismissed=true;
      toast('已确认默认区域：'+byRegion[detectedRegion].label+' · 城市话题仅在你主动添加后发布');
    }
    else if(a==='change'){ settingsOpen=true; renderAll(); toast('可在设置「手动切换当前国家」里选择任意国家（单选，不必与定位一致）；国际频道在任何国家都显示'); }
    else if(a==='off'){
      locStage='off'; locLocked=true; setCountry('');
      toast('已关闭定位：仅显示国际频道，不推断所在国家');
    }
    else if(a==='on'){ locStage='prompt'; locLocked=false; toast('已重新开启定位：等待确认后生效'); }
    else if(a==='replay'){ locStage='prompt'; locLocked=false; detectedRegion='UK'; detectedCity='伦敦'; locSource='ip_edge'; composeDraft.cityTopicDismissed=true; toast('已重放首次进入的定位确认'); }
    else if(a==='sim-jp'){
      detectedRegion='JP'; detectedCity='东京'; locSource='ip_edge'; locStage='prompt'; locLocked=false; composeDraft.cityTopicDismissed=true;
      setCountry('JP');
      toast('模拟定位到日本：未开通 → 只显示国际频道，英国的分类数据不会出现');
    }
    else if(a==='sim-uk'){
      detectedRegion='UK'; detectedCity='伦敦'; locSource='ip_edge'; locStage='prompt'; locLocked=false; composeDraft.cityTopicDismissed=true;
      setCountry('UK');
      toast('模拟定位回英国：显示国际频道 + 英国分类频道');
    }
    renderAll(); return;
  }
  const apply = e.target.closest('[data-apply]');
  if(apply){
    const code = apply.dataset.apply;
    launchRequests[code] = (launchRequests[code]||0)+1;
    toast('已登记「'+byRegion[code].label+'」开通需求（第 '+launchRequests[code]+' 位）· 仅为需求信号，不代表该法域已上线');
    renderAll(); return;
  }
  const tab = e.target.closest('.tab'); if(tab) return switchTab(tab.dataset.tab);
  const goto = e.target.closest('[data-goto]'); if(goto){activeTab=goto.dataset.goto;if(currentPage!=='home')setPage('home');return switchTab(goto.dataset.goto);}
  const pref = e.target.closest('[data-playpref]');
  if(pref){
    if(pref.dataset.playpref==='autoplay'){
      autoplayFirst = !autoplayFirst;
      toast(autoplayFirst?'平台自有视频：已开启静音自动播':'平台自有视频：已关闭自动播');
    } else {
      thirdPartyAlways = !thirdPartyAlways;
      toast(thirdPartyAlways?'第三方播放器：首次同意后默认站内播放':'第三方播放器：恢复每次询问');
    }
    renderAll(); return;
  }
  const cold = e.target.closest('[data-cold]');
  if(cold){
    subs.clear(); activeRegions.clear(); coldStart = true;
    renderAll(); toast('已模拟新用户：0 订阅，推荐流仍有内容'); return;
  }
  const pt = e.target.closest('[data-playtoggle]');
  if(pt){ togglePlayback(pt.dataset.playtoggle); return; }
  const em = e.target.closest('[data-embed]');
  if(em){
    const k=em.dataset.embed, a=em.dataset.embedAct;
    if(a==='play'){
      if(thirdPartyAlways){ embedState[k]='playing'; renderAll(); toast('已按偏好默认站内播放（同意可在设置撤回）'); }
      else { embedState[k]='consent'; renderAll(); toast('首次加载：需确认第三方数据条款（PECR）'); }
    }
    else if(a==='once'||a==='always'){
      if(a==='always') thirdPartyAlways = true;
      embedState[k]='playing'; renderAll();
      toast(a==='once'?'仅本次加载：已写入同意日志':'已记住偏好：此后默认站内播放，可在「设置 → 隐私」撤回');
    }
    else if(a==='close'){ embedState[k]='idle'; renderAll(); toast('已卸载第三方播放器'); }
    else if(a==='external'){ toast('跳转原站观看（不嵌入、不代理、不缓存）'); }
    return;
  }
  const rcType = e.target.closest('[data-rc-type]');
  if(rcType){
    roomDraft.type = rcType.dataset.rcType || rcType.textContent.trim() || '通用';
    document.querySelectorAll('.rc-types .rc-type').forEach(b=>{
      b.classList.toggle('active', b===rcType);
      b.setAttribute('aria-checked', b===rcType?'true':'false');
    });
    updateRoomSubmit(); return;
  }
  const join = e.target.closest('[data-join]');
  if(join){
    requestJoin('channel',join.dataset.join); return;
  }
  const pack = e.target.closest('[data-pack]');
  if(pack){
    const p = packs.find(x=>x.code===pack.dataset.pack);
    if(p.region!=='GLOBAL' && (p.region!==currentCountry() || !countryDataOn())){
      toast(jurisdictionIsLaunched(byRegion[p.region].jurisdiction)?'「'+p.name+'」属于'+directoryCountryName(p.region)+'，切换到该国家后才能'+TERMS.chFollow:directoryCountryName(p.region)+'尚未开通，暂无国家频道 · 可在目录底部登记开通需求');
      return;
    }
    p.codes.forEach(c=>subs.add(c));
    toast('已'+TERMS.chFollow+'「'+p.name+'」· '+p.codes.length+' 个频道');
    renderAll(); return;
  }
  const rm = e.target.closest('[data-rmregion]');
  if(rm){
    const code = rm.dataset.rmregion;
    setCountry('');
    toast('已离开「'+byRegion[code].label+'」：只显示国际频道；该国的关注与收藏保留，切回后恢复');
    renderAll(); return;
  }
  const cluster = e.target.closest('[data-cluster]');
  if(cluster){
    const key = cluster.dataset.cluster;
    const box = Array.from(document.querySelectorAll('.sources')).find(n=>n.dataset.sources===key);
    if(box) box.classList.toggle('hidden'); return;
  }
  const likeB = e.target.closest('[data-like]');
  if(likeB){
    const k = likeB.dataset.like;
    const doLike=()=>{ const on=UKCN.toggleLike(k); syncActState('data-like',k,!!on,['喜欢','已喜欢']); };
    if(UKCN.isGuest()){UKCN.requireAuth('喜欢内容',()=>{reloadFromStore();doLike();renderAll();});return;}
    doLike();
    return;
  }
  const shareB = e.target.closest('[data-share]');
  if(shareB){ UKCN.shareLink({title:shareB.dataset.share, url:String(location.href).split('#')[0].split('?')[0]+'#post='+encodeURIComponent(shareB.dataset.share)}); return; }
  const repostB = e.target.closest('[data-repost]');
  if(repostB){
    const t = repostB.dataset.repost;
    if(UKCN.isGuest()){ UKCN.requireAuth('转发内容',()=>{}); return; }
    toast('已转发到「我的 · 动态」· 附「转发」来源标注（演示）');
    return;
  }
  const save = e.target.closest('[data-save]');
  if(save){
    const k = save.dataset.save;
    const doSave=()=>{
      if(saved.has(k)){ saved.delete(k); syncActState('data-save',k,false,['收藏','已收藏']); toast('已取消收藏'); }
      else { saved.add(k); syncActState('data-save',k,true,['收藏','已收藏']); toast('已收藏 · 在「我的 · 收藏」查看'); }
      persist();
      if(currentPage==='favorites') renderPage();
    };
    if(UKCN.isGuest()){UKCN.requireAuth('收藏内容',()=>{reloadFromStore();doSave();renderAll();});return;}
    doSave();
    return;
  }
  const rcSubmit = e.target.closest('.rc-go');
  if(rcSubmit){
    if(rcSubmit.disabled) return;
    const input = document.querySelector('.rc-input');
    const parentCode=document.querySelector('#roomParentSelect')?.value||roomParentSelection;
    const parent=byCode[parentCode];
    const name=String(input?.value||roomDraft.name).trim();
    roomDraft.name=name;
    if(!name||!canHostRooms(parent)){toast('请填写房间名并选择所属频道');return;}
    if(myRooms.some(r=>r.name===name)){toast('已有同名房间「'+name+'」，换个名字吧');return;}
    UKCN.requireAuth('创建房间「'+name+'」',()=>{
      reloadFromStore();
      const typeLabel=roomDraft.type||'通用';
      const typeCode=ROOM_TYPES[typeLabel]||'general';
      const category=parent.category||'其他';
      const room=UKCN.createRoom({name,type:typeLabel+' · 0 条',typeCode,category,parentCode,region:byCode[parentCode]?.region||'GLOBAL',parentName:byCode[parentCode]?.name||'',private:roomDraft.private,review:'房间名与简介审核中'});
      if(!room)return;
      if(!myRooms.some(r=>r.id===room.id))myRooms.unshift(room);
      roomJoined.add(name);persist();
      roomDraft.name='';roomDraft.type='通用';roomDraft.private=false;roomDraft.moreOpen=false;
      toast('房间「'+name+'」已创建 · '+typeLabel+' · 归属「'+parent.name+'」');
      const q=new URLSearchParams({name,roomId:room.id,type:typeCode,joined:'true',parent:parentCode,parentName:parent.name,created:'1'});
      if(typeof location!=='undefined'&&location.href!==undefined&&typeof requestAnimationFrame==='function')location.href='prototype-collection-room.html?'+q.toString();
      else renderAll();
    });
    return;
  }
  const rcToggle = e.target.closest('[data-rc-more]');
  if(rcToggle){
    const room = rcToggle.closest('.room-create');
    const collapsed = room.classList.toggle('collapsed');
    roomDraft.moreOpen = !collapsed;
    rcToggle.setAttribute('aria-expanded', roomDraft.moreOpen?'true':'false');
    return;
  }
  const privacyChoice=e.target.closest('[data-rc-privacy]');
  if(privacyChoice){roomDraft.private=!roomDraft.private;privacyChoice.classList.toggle('active',roomDraft.private);privacyChoice.setAttribute('aria-pressed',String(roomDraft.private));privacyChoice.textContent=roomDraft.private?'私密 · 仅获准成员可见':'公开 · 所有人可见';return;}
  const directoryRegion=e.target.closest('[data-directory-region]');
  if(directoryRegion){directoryRegionFilter=directoryRegion.dataset.directoryRegion;renderAll();return;}
  const categoryFilter=e.target.closest('[data-channel-category]');
  if(categoryFilter){channelCategoryFilter=categoryFilter.dataset.channelCategory;if(currentPage==='discover')renderPage();else renderAll();return;}
  const addSegBtn = e.target.closest('[data-add-seg]');
  if(addSegBtn){
    addSeg = addSegBtn.dataset.addSeg==='create'?'create':'directory';
    document.querySelectorAll('.add-seg button').forEach(b=>{
      const on = b===addSegBtn;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on?'true':'false');
    });
    document.querySelectorAll('[data-add-body]').forEach(b=>b.classList.toggle('hidden', b.dataset.addBody!==addSeg));
    return;
  }
  const roomJoin = e.target.closest('[data-roomjoin]');
  if(roomJoin){
    requestJoin('room',roomJoin.dataset.roomjoin); return;
  }
});

document.addEventListener('input', e=>{
  if(e.target.id==='homeComposerBody'){
    composeDraft.body=e.target.value;openHomeComposer();updateHomeComposer();return;
  }
  if(e.target.id==='homeComposerTitle'){composeDraft.title=e.target.value;updateHomeComposer();return;}
  if(e.target.id==='homeComposerTopicInput'){composeDraft.topicDraft=e.target.value;return;}
  if(e.target.closest('.rc-input')){
    roomDraft.name=e.target.value;
    updateRoomSubmit();
  }
  if(e.target.id==='searchInput'&&currentPage==='discover')renderPage();
});

document.addEventListener('change',e=>{
  if(e.target.id==='countryPick'){
    /* PRD §36.6：允许手动切换当前国家，不要求与定位一致；手动选择优先，之后定位不再自动覆盖 */
    const code=e.target.value; setCountry(code); locLocked=true; locSource='self'; if(code&&locStage==='off')locStage='confirmed';
    renderAll();
    toast(code?('已切换到'+directoryCountryName(code)+(countryDataOn()?'：显示国际频道 + '+directoryCountryName(code)+'分类':'：未开通，只显示国际频道')):'已不选国家：只显示国际频道');
    return;
  }
  if(e.target.id==='roomParentSelect'){roomParentSelection=e.target.value;roomCategorySelection=byCode[roomParentSelection]?.category||roomCategorySelection;const ci=$('#roomCategoryInherit');if(ci)ci.innerHTML=roomCategoryInheritText(roomParentSelection);updateRoomSubmit();}
});

document.addEventListener('focusin',e=>{
  if(e.target.id==='homeComposerBody')openHomeComposer();
});

/* v2.6 私信：发送文字（Ctrl/⌘+Enter 也可发送）与图片 */
document.addEventListener('submit',e=>{
  const f=e.target.closest&&e.target.closest('[data-dm-form]');
  if(!f)return;
  e.preventDefault();
  const i=$('#dmInput');
  if(sendDM(f.dataset.dmForm,{text:i?i.value:''})){const n=$('#dmInput');if(n&&typeof n.focus==='function')n.focus();}
});
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='dmInput'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();const f=e.target.closest('[data-dm-form]');if(f)sendDM(f.dataset.dmForm,{text:e.target.value});}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='dmFile')return;
  const file=(e.target.files||[])[0];e.target.value='';
  const f=document.querySelector('[data-dm-form]');
  if(!file||!f)return;
  if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)||file.size>5*1024*1024){toast('图片请使用 PNG、JPG、WebP 或 GIF，单张不超过 5 MB');return;}
  const reader=new FileReader();
  reader.onload=()=>{const src=String(reader.result);if(sendDM(f.dataset.dmForm,{kind:'image',src,alt:file.name||'图片'})&&src.length>=150000)toast('图片已发送 · 演示环境不保存大图原图');};
  reader.readAsDataURL(file);
});

document.addEventListener('change',e=>{
  if(e.target.id==='homeComposerDestination'){composeDraft.destination=e.target.value;return;}
  if(e.target.id==='homeComposerRights'){composeDraft.rights=e.target.checked;updateHomeComposer();return;}
  if(e.target.id==='homeComposerImageInput'){
    const files=Array.from(e.target.files||[]);e.target.value='';
    const remaining=Math.max(0,4-composeDraft.images.length);
    if(files.length>remaining)toast('最多添加 4 张图片');
    files.slice(0,remaining).forEach(file=>{
      if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>5*1024*1024){toast('图片请使用 PNG、JPG 或 WebP，单张不超过 5 MB');return;}
      const reader=new FileReader();
      reader.onload=()=>{composeDraft.images.push({src:String(reader.result),name:file.name||'用户上传图片'});renderHomeComposerAttachments();};
      reader.onerror=()=>toast('图片读取失败，请重试');
      reader.readAsDataURL(file);
    });
    return;
  }
  if(e.target.id==='homeComposerVideoInput'){
    const file=(e.target.files||[])[0];e.target.value='';
    if(!file)return;
    if(!/^video\/(mp4|webm|quicktime)$/.test(file.type)||file.size>100*1024*1024){toast('请选择 MP4、WebM 或 MOV 视频，文件不超过 100 MB');return;}
    if(composeDraft.video?.src)URL.revokeObjectURL(composeDraft.video.src);
    composeDraft.video={src:URL.createObjectURL(file),name:file.name};composeDraft.rights=false;
    renderHomeComposerAttachments();
  }
});

/* v2.5 · 桌面快捷键：「/」聚焦搜索，Esc 退出搜索框（输入框里打字不触发） */
document.addEventListener('keydown', e=>{
  const typing=e.target&&(e.target.closest?e.target.closest('input,textarea,select,[contenteditable="true"]'):null);
  if(e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!UKCN.isOpen()){const s=$('#searchInput');if(s&&!$('#topSearch').classList.contains('hidden')){e.preventDefault();document.body.classList.remove('hdr-hide');s.focus();}return;}
  if(e.key==='Escape'&&e.target&&e.target.id==='searchInput'){e.target.blur();}
  if(e.key==='Escape'&&postDetailState.open){closePostDetail();return;}
});
document.addEventListener('keydown', e=>{
  if(e.target.id==='homeComposerBody'&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();publishHomeComposer();return;}
  if(e.target.id==='homeComposerTopicInput'&&e.key==='Enter'){e.preventDefault();addHomeComposerTopic();return;}
  if(e.target && e.target.id==='searchInput' && e.key==='Enter'){
    e.preventDefault(); commitSearch(e.target.value); return;
  }
  if(e.key!=='Enter' && e.key!==' ') return;
  const t = e.target && e.target.closest && e.target.closest('[data-playtoggle]');
  if(t){ e.preventDefault(); togglePlayback(t.dataset.playtoggle); }
});

$('#themeBtn').addEventListener('click',()=>{
  const cur = document.body.dataset.theme;
  document.body.dataset.theme = cur==='dark' ? 'light' : 'dark';
  toast('已切换'+(cur==='dark'?'浅色':'深色')+'主题');
});
$('#mobileBtn').addEventListener('click',()=>{
  const on = document.body.classList.toggle('preview-mobile');
  const label = $('#viewLabel');
  if(label) label.textContent = on ? '移动视图' : '桌面视图';
});
$('#searchInput').addEventListener('input',e=>{
  searchTerm = e.target.value;
  renderAdd();
  renderSearch();
});

/* 从房间原型 / 发布页跳回时，按 URL 参数定位到对应 Tab 或页面 */
(function(){
  let p;
  try { p = new URLSearchParams(location.search); }
  catch(e){ p = null; }
  if(!p) return;
  const tab = p.get('tab');          // foryou | following | add
  const page = p.get('page');        // home | discover | notifications | favorites
  const channel = p.get('channel');  // open a channel detail directly
  const seg = p.get('seg');          // directory | create（添加页分段）
  const parent = p.get('parent');
  if(parent&&canHostRooms(byCode[parent]))roomParentSelection=parent;
  if(seg && ['directory','create'].includes(seg)) addSeg = seg;
  /* v2.6：?page=notifications&msg=notif 打开「通知」分段（默认「私信」）；&dm=@handle 直接打开会话（游客先登录）；?user=@handle 打开个人主页 */
  const msg=p.get('msg'), dmTo=p.get('dm'), user=p.get('user');
  if(msg&&['dm','notif'].includes(msg))msgTab=msg;
  if(user&&/^@[\w.-]{1,32}$/.test(user)){openProfile(user);profileReturn=null;}
  if(page && ['discover','notifications','favorites','my-channels','me'].includes(page)){
    if(page==='discover'&&channel&&byCode[channel])discoverDetailCode=channel;
    if(page==='discover'&&p.get('listing'))listingDetailId=p.get('listing');
    setPage(page);
  }
  if(tab && ['foryou','following','add'].includes(tab)){
    activeTab = tab;
    switchTab(activeTab);
  }
  if(dmTo&&/^@[\w.-]{1,32}$/.test(dmTo))startDM(dmTo,(p.get('name')||'').slice(0,40));
})();

document.body.classList.toggle('publish-fab-page',['home','discover'].includes(currentPage));
renderAll();
</script>
