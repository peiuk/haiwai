<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海外圈 · 首页原型 v12（频道多图、手机视频与房间帖子示例）</title>
<style>
/* Design System v1.4 · 与 design-system/tokens.css 同步；v6 精简层见 <style> 末尾 §17 段 */
:root{
  --bg:#ffffff; --surface:#f7f9f9; --surface2:#eff3f4; --text:#0f1419;
  --muted:#536471; --border:#e6ecf0; --line:#707c87; --accent:#1d9bf0;
  --accent-soft:rgba(29,155,240,.12); --hover:rgba(15,20,25,.04);
  --accent-ink:#0a6ba8; --accent-strong:#0a72b4; --on-accent:#ffffff; --focus:#0a6ba8;
  --chip:#eff3f4; --shadow:0 2px 12px rgba(0,0,0,.08);
  --good:#00875a; --good-solid:#00875a; --on-good:#ffffff;
  --warn:#a86800; --danger:#d02b32;
  --media-ph-a:#12303f; --media-ph-b:#2b3a4a; --media-ph-c:#4a3520;
  --tap:44px; --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --z-sticky:20; --z-bottom-bar:30; --z-toast:50; --z-modal:60;
  --on-media:#ffffff; --scrim-base:#000000; --player-bg:#0b0f12; --player-text:#e7e9ea; --player-muted:#9aa6b1;
}
[data-theme="dark"]{
  --bg:#000000; --surface:#16181c; --surface2:#202327; --text:#e7e9ea;
  --muted:#9aa6b1; --border:#2f3336; --line:#6d7781; --accent:#1d9bf0;
  --accent-soft:rgba(29,155,240,.18); --hover:rgba(231,233,234,.07);
  --accent-ink:#1d9bf0; --accent-strong:#1d9bf0; --on-accent:#0f1419; --focus:#1d9bf0;
  --chip:#202327; --shadow:0 2px 12px rgba(0,0,0,.5);
  --good:#3ccf91; --good-solid:#3ccf91; --on-good:#0f1419;
  --warn:#e0a838; --danger:#f07579;
  --media-ph-a:#12303f; --media-ph-b:#2b3a4a; --media-ph-c:#4a3520;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.hidden{display:none !important}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ico.sm{width:16px;height:16px}

/* 外链站内播放：静态占位 → 点击 → 同意 → 官方 iframe（客户端直连） */
.embed-slot{margin-top:10px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)}
.embed-ph{display:flex;align-items:center;gap:12px;padding:12px;flex-wrap:wrap;min-height:88px}
.embed-ph .ph-ico{width:48px;height:48px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:20px;flex-shrink:0}
.embed-ph .ph-tx{flex:1;min-width:0}
.embed-ph .ph-t{font-size:13px;font-weight:700}
.embed-ph .ph-s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.55}
.ebtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--accent-strong);color:var(--on-accent);font-size:12px;font-weight:700;white-space:nowrap}
.ebtn:hover{opacity:.9;text-decoration:none}
.ebtn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.ebtn.ghost:hover{background:var(--hover);opacity:1}
.econsent{padding:12px;background:color-mix(in srgb,var(--warn) 10%,transparent);border-top:1px solid var(--border);font-size:12px;line-height:1.75}
.econsent .cops{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.eplayer{position:relative;aspect-ratio:16/9;background:var(--player-bg);display:grid;place-items:center;color:var(--player-text);text-align:center}
.eplayer .fk{padding:12px}
.eplayer .fk .l{font-size:12px;letter-spacing:2px;color:var(--player-muted)}
.eplayer .fk .h{font-size:15px;font-weight:700;margin:8px 0 6px}
.eplayer .fk .s{font-size:12px;color:var(--player-muted);line-height:1.7;max-width:360px}
.eplayer .bar{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(transparent,color-mix(in srgb,var(--scrim-base) 85%,transparent));display:flex;justify-content:space-between;align-items:center;font-size:12px}

.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr) 320px;min-height:100vh}
.left{border-right:1px solid var(--border);padding:12px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.right{border-left:1px solid var(--border);padding:12px 20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{border-right:1px solid var(--border);min-width:0}

.brand{display:flex;align-items:center;gap:10px;padding:10px 8px 18px;font-size:19px;font-weight:700;letter-spacing:.3px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--accent-strong);color:var(--on-accent);display:grid;place-items:center;font-size:17px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:16px;padding:12px 14px;min-height:44px;border-radius:999px;font-size:19px;color:var(--text);width:100%;text-align:left;position:relative}
.nav-item:hover{background:var(--hover)}
.nav-item.active{font-weight:700}
.nav-item .ico{width:24px;height:24px;display:grid;place-items:center;font-size:21px;line-height:1}
.badge{position:absolute;left:32px;top:4px;background:var(--accent-strong);color:var(--on-accent);font-size:12px;font-weight:700;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.post-btn{background:var(--accent-strong);color:var(--on-accent);border-radius:999px;padding:14px;min-height:44px;font-size:16px;font-weight:700;margin-top:14px;width:100%}
.post-btn:hover{opacity:.9}
.me{display:flex;align-items:center;gap:10px;margin-top:auto;padding:10px;border-radius:999px}
.me:hover{background:var(--hover)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--on-media);font-weight:700;font-size:14px;flex-shrink:0}
.me .name{font-weight:700;font-size:14px}
.me .handle{color:var(--muted);font-size:13px}

.top{position:sticky;top:0;z-index:var(--z-sticky);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top-head{display:flex;align-items:center;gap:12px;padding:12px 16px 6px}
.top-head h1{margin:0;font-size:19px;font-weight:800;flex-shrink:0}
.top-tools{display:flex;gap:6px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent-ink)}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:15px 4px 13px;font-size:15px;color:var(--muted);font-weight:500;position:relative;text-align:center;white-space:nowrap}
.tab:hover{background:var(--hover)}
.tab.active{color:var(--text);font-weight:700}
.tab.active::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:4px;border-radius:999px;background:var(--accent)}
.demo-note{padding:8px 16px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}

.panel{padding-bottom:80px}
/* v2.1 · 「正在关注」未读分隔线 */
.unread-divider{display:flex;align-items:center;gap:12px;padding:10px 16px;color:var(--accent-ink);font-size:13px;font-weight:600;border-bottom:1px solid var(--border)}
.unread-divider::before,.unread-divider::after{content:"";flex:1;height:1px;background:var(--accent)}
.ai-src{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
.ai-badge{font-style:normal;font-size:12px;font-weight:700;padding:0 5px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink)}
.section-hint{padding:12px 16px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:12px;font-weight:600}

.card{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;gap:12px;transition:background .15s}
.card:hover{background:var(--hover)}
.card .avatar{width:42px;height:42px;font-size:15px}
.card-body{min-width:0;flex:1}
.card-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:14px;line-height:1.3}
.card-meta .nm{font-weight:700}
.card-meta .hd,.card-meta .tm{color:var(--muted)}
.card-meta .tm::before{content:"·";margin-right:5px}
.verified{color:var(--accent-ink);font-size:13px}
.why{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);background:var(--chip);padding:3px 9px;border-radius:999px;margin:8px 0 6px}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--accent);padding:2px 0 2px 10px;margin:8px 0}
.card h3{margin:6px 0 5px;font-size:16px;line-height:1.4;font-weight:700}
.card p{margin:0;font-size:14px;color:var(--text);line-height:1.65}
.src{margin-top:9px;padding:9px 11px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.src b{color:var(--text);font-weight:600}
.src .lic{border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
.cluster-btn{margin-left:auto;color:var(--accent-ink);font-size:12px;font-weight:600;cursor:pointer;background:none;border:none;padding:0}
.sources{margin-top:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sources a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;font-size:12px;border-bottom:1px solid var(--border);color:var(--text)}
.sources a:last-child{border-bottom:none}
.sources a:hover{background:var(--surface);text-decoration:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:12px;color:var(--accent-ink)}
.actions{display:flex;justify-content:space-between;max-width:400px;margin-top:10px;color:var(--muted)}
.act{display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 6px;border-radius:999px}
.act:hover{color:var(--accent-ink);background:var(--accent-soft)}
.act.saved{color:var(--accent-ink)}
.read-origin{color:var(--accent-ink);font-weight:600}

.compose{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.compose .box{flex:1;border:1px solid var(--border);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:14px;background:var(--surface)}
.home-composer{align-items:flex-start}
.inherit-cat{min-height:44px;display:flex;align-items:center;padding:0 12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}
.inherit-cat b{color:var(--text);margin-right:4px}
.field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.home-composer .home-composer-body{flex:1;min-width:0;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:10px 12px}
.home-composer-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.home-composer-label{font-size:12px;color:var(--muted)}
.home-composer-destination{min-height:44px;max-width:190px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--accent-ink);font:inherit;font-size:12px;font-weight:600}
.home-composer textarea{display:block;width:100%;min-height:44px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15px;line-height:1.55;padding:6px 0}
.home-composer textarea::placeholder{color:var(--muted)}
.home-composer-options{border-top:1px solid var(--border);margin-top:8px;padding-top:10px}
.home-compose-types{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.home-compose-types::-webkit-scrollbar{display:none}
.home-compose-type{min-height:44px;padding:0 12px;border:1px solid transparent;border-radius:999px;color:var(--muted);font-size:12px;white-space:nowrap}
.home-compose-type:hover{background:var(--hover)}
.home-compose-type.active{border-color:var(--line);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.home-compose-extra{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.home-compose-extra .field{flex:1;min-width:0}
.home-compose-extra label{display:block;margin-bottom:4px;color:var(--muted);font-size:12px}
.home-compose-extra input,.home-compose-extra select,.home-compose-topic-input{width:100%;min-height:44px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg);color:var(--text);font:inherit;font-size:13px}
.home-compose-check{display:flex;align-items:flex-start;gap:8px;margin-top:10px;color:var(--muted);font-size:12px;line-height:1.5}
.home-compose-check input{width:18px;height:18px;flex:none;accent-color:var(--accent-strong)}
.home-compose-topics{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.home-compose-topic{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px}
.home-compose-topic button{width:22px;height:22px;border-radius:50%;color:inherit}
.home-compose-city-note{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.45}
.home-compose-city-note b{color:var(--accent-ink)}
.home-compose-city{min-height:44px;margin-top:7px;padding:0 10px;border:1px solid var(--line);border-radius:999px;color:var(--accent-ink);font-size:12px}
.home-compose-city:hover{background:var(--accent-soft)}
.home-compose-attachments{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.home-compose-attachments:empty{display:none}
.home-compose-attachment{position:relative;min-width:0;aspect-ratio:1;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface2)}
.home-compose-attachment img,.home-compose-attachment video{width:100%;height:100%;object-fit:cover;display:block}
.home-compose-attachment button{position:absolute;top:2px;right:2px;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--scrim-base) 70%,transparent);color:var(--on-media)}
.home-compose-toolbar{display:flex;align-items:center;gap:4px;margin-top:8px;padding-top:7px;border-top:1px solid var(--border)}
.home-compose-tool{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:44px;min-height:44px;padding:0 9px;border-radius:999px;color:var(--accent-ink);font-size:12px}
.home-compose-tool:hover{background:var(--accent-soft)}
.home-compose-spacer{flex:1}
.home-compose-count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.home-compose-count.over{color:var(--danger)}
.home-compose-submit{min-height:44px;padding:0 16px;border-radius:999px;background:var(--accent-strong);color:var(--on-accent);font-size:13px;font-weight:700}
.home-compose-submit:disabled{opacity:.45;cursor:not-allowed}
.home-compose-error{min-height:0;margin:6px 0 0;color:var(--danger);font-size:12px}
.uploaded-post-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .nm.user-post-name{padding:0;background:transparent;color:var(--text);font-weight:700}
.card .nm.user-post-name:hover{color:var(--text)}
.home-compose-advanced{min-height:44px;padding:0 9px;border-radius:999px;color:var(--muted);font-size:12px}
.home-compose-advanced:hover{background:var(--hover);color:var(--text)}
.group-title{padding:16px 16px 7px;font-size:13px;font-weight:800;color:var(--accent-ink);letter-spacing:.2px}
.channel-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.channel-row .avatar{width:44px;height:44px;border-radius:12px;font-size:16px}
.channel-row .info{flex:1;min-width:0}
.channel-row .cname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.channel-row .cdesc{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.channel-row .cstat{font-size:12px;color:var(--muted);margin-top:4px}
.channel-preview{display:flex;align-items:center;gap:6px;min-width:0;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.4}
.channel-preview .label{flex:none;color:var(--accent-ink);font-weight:700}
.channel-preview .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.directory-intro{position:relative;overflow:hidden;margin:12px 16px 8px;padding:17px 18px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(135deg,var(--surface2),var(--accent-soft))}
.directory-intro:after{content:"";position:absolute;width:120px;height:120px;right:-38px;top:-58px;border-radius:50%;background:var(--surface);opacity:.48;pointer-events:none}
.directory-intro-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.directory-eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent-ink)}
.directory-joined-count{flex:none;padding:5px 9px;border-radius:999px;background:var(--surface);color:var(--accent-ink);font-size:12px;font-weight:700}
.directory-intro h2{position:relative;z-index:1;margin:10px 0 0;font-size:19px;line-height:1.3}
.directory-intro p{position:relative;z-index:1;max-width:440px;margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
.directory-filters{display:grid;gap:6px;padding:10px 16px 12px;border-bottom:1px solid var(--border)}
.directory-country-head{padding:14px 16px 5px;color:var(--text);font-size:15px;font-weight:800;border-top:1px solid var(--border)}
.directory-filter-row{display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.directory-filter-row::-webkit-scrollbar{display:none}
.directory-filter-row{mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
.directory-filter-row:focus-within{mask-image:none}
.directory-filter-label{flex:none;color:var(--muted);font-size:12px;min-width:54px}
.directory-filter-row .page-filter{flex:none;min-height:44px;padding:0 12px}
.directory-filter-row .page-filter.active{background:var(--accent-strong);color:var(--on-accent)}
.directory-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:14px 16px 5px}
.directory-section-head h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.15px}
.directory-section-head span{color:var(--muted);font-size:12px}
.directory-channel-row{margin:7px 12px;padding:12px;border:1px solid var(--border);border-radius:15px;background:var(--surface);transition:border-color .16s,box-shadow .16s,transform .16s}
.directory-channel-row:hover{border-color:var(--accent);box-shadow:0 5px 16px color-mix(in srgb,var(--text) 6%,transparent);transform:translateY(-1px)}
.directory-channel-row .avatar{width:48px;height:48px;border-radius:15px}
.directory-channel-row .join{min-width:78px;min-height:44px;padding:0 13px;border:0;border-radius:999px;background:var(--accent-strong);color:var(--on-accent);font-weight:800}
.directory-channel-row .join.joined{background:var(--accent-soft);color:var(--accent-ink)}
.directory-channel-row .channel-preview{padding-top:6px;border-top:1px solid var(--border)}
.directory-empty{padding:22px 16px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--border)}
.directory-policy{margin:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.directory-policy summary{min-height:44px;padding:10px 14px;display:flex;align-items:center;cursor:pointer;font-size:13px;font-weight:700}
.directory-policy .policy-body{padding:0 12px 12px}
.channel-open{padding:0;color:inherit;font:inherit;font-weight:700;text-align:left}
.channel-open:hover{color:var(--accent-ink);text-decoration:underline}
.channel-card-open{padding:0;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer;text-align:left}

.join{min-height:44px}

.packs{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding:6px 16px 12px;margin:0}

.packs:focus-within{mask-image:none}
.pack{flex:0 0 min(78vw,290px);scroll-snap-align:start;border:1px solid var(--border);border-radius:var(--r-lg);padding:11px 12px;background:var(--surface2)}

.media{margin-top:10px;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface2)}

.mframe{position:relative;min-height:132px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--media-ph-a),var(--media-ph-b))}

.mframe.a2{background:linear-gradient(135deg,var(--media-ph-c),var(--media-ph-a))}
.mframe.a3{background:linear-gradient(135deg,var(--media-ph-a),var(--media-ph-c))}

.pb-btn.on{background:var(--accent-strong);color:var(--on-accent);border-color:var(--accent-strong)}
.why-params{font-size:12px;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--border);line-height:1.7}
/* ===== PRD §28 · 自动定位与区域 / 频道开通权限（复用既有 token，不新增颜色） ===== */
.loc-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2);font-size:12px}

/* ===== v6 · 首屏精简层（MASTER §17）：区域 / 定位 / 播放 / 推荐设置一律在顶部，帖子区只留内容 ===== */

.dm-req-entry{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;text-align:left;border-bottom:1px solid var(--line);color:var(--text)}

.dm-row-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 16px;text-align:left;color:var(--text)}

.dm-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dm-row-top{display:flex;align-items:baseline;gap:6px;min-width:0}
.dm-row-top b{flex:0 1 auto;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-handle,.dm-time{font-size:13px;color:var(--muted);white-space:nowrap}
.dm-row-top .dm-handle{flex:0 2 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dm-time{margin-left:auto}
.dm-row-preview{font-size:15px;line-height:1.5;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.profile{padding-bottom:24px}

body.dm-thread-open .fab{display:none !important}
@media(max-width:760px){.dm-compose{bottom:calc(56px + env(safe-area-inset-bottom))}}

    var st = document.createElement('style'); st.id = 'uksStyle'; st.textContent = CSS; document.head.appendChild(st);
  }

  /* ---------- 通用弹层 ---------- */
  var layer = null, lastFocus = null, onCloseCb = null;
  function closeLayer(){
    if (layer && layer.parentNode) layer.parentNode.removeChild(layer);
    layer = null;
    if (typeof document !== 'undefined' && document.removeEventListener) document.removeEventListener('keydown', trapKeys, true);
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
    var cb = onCloseCb; onCloseCb = null; if (cb) cb();
  }
  function trapKeys(e){
    if (!layer) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeLayer(); return; }
    if (e.key !== 'Tab') return;
    var f = Array.prototype.filter.call(layer.querySelectorAll('button,input,select,textarea,a[href]'), function(el){ return !el.disabled && el.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  function openLayer(html, onClose){
    if (!hasDoc() || !document.body || typeof document.createElement !== 'function') return null;
    ensureStyle();
    if (layer) { onCloseCb = null; closeLayer(); }
    lastFocus = document.activeElement;
    layer = document.createElement('div');
    layer.className = 'uks-backdrop';
    layer.innerHTML = html;
    layer.addEventListener('click', function(e){ if (e.target === layer) closeLayer(); });
    document.body.appendChild(layer);
    document.addEventListener('keydown', trapKeys, true);
    onCloseCb = onClose || null;
    focusFirst();
    return layer;
  }
  function focusFirst(){
    if (!layer) return;
    var el = layer.querySelector('[data-uks-autofocus]') || layer.querySelector('input,button.primary,button');
    if (el && el.focus) { try { el.focus(); } catch (e) {} }
  }
  function sheet(title, sub, body, stepInfo){
    return '<div class="uks-sheet" role="dialog" aria-modal="true" aria-labelledby="uksTitle">'
      + '<div class="uks-head">' + (stepInfo || '') + '<button type="button" class="uks-x" data-uks-close aria-label="关闭">' + CLOSE_SVG + '</button></div>'
      + '<h2 id="uksTitle">' + esc(title) + '</h2>' + (sub ? '<p class="uks-sub">' + esc(sub) + '</p>' : '')
      + '<div class="uks-body">' + body + '</div></div>';
  }
  function setSheet(title, sub, body, stepInfo){
    if (!layer) return;
    layer.innerHTML = sheet(title, sub, body, stepInfo);
    bindClose();
    focusFirst();
  }
  function bindClose(){
    if (!layer) return;
    Array.prototype.forEach.call(layer.querySelectorAll('[data-uks-close]'), function(b){ b.addEventListener('click', function(){ closeLayer(); }); });
  }
  function q(sel){ return layer ? layer.querySelector(sel) : null; }
  function busy(btn, on, label){
    if (!btn) return;
    if (on) { btn._label = btn.innerHTML; btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.innerHTML = '<span class="uks-spin" aria-hidden="true"></span>' + esc(label || '处理中…'); }
    else { btn.disabled = false; btn.removeAttribute('aria-busy'); if (btn._label) btn.innerHTML = btn._label; }
  }
  function toast(msg){
    if (!hasDoc()) return;
    var t = document.querySelector('#toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._uksTimer); t._uksTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  /* ---------- 轻注册 / 登录（3 屏） ---------- */
  function dots(n){ return '<span class="uks-step">第 ' + n + ' / 3 步</span><span class="uks-dots" aria-hidden="true"><i class="' + (n >= 1 ? 'on' : '') + '"></i><i class="' + (n >= 2 ? 'on' : '') + '"></i><i class="' + (n >= 3 ? 'on' : '') + '"></i></span>'; }
  function requireAuth(reason, cb){
    if (me()) { if (cb) cb(); return true; }
    openAuth(reason, cb);
    return false;
  }
  function openAuth(reason, cb){

    step1(flow);
  }
  function step1(flow){
    var phone = flow.mode === 'phone';
    setSheet('登录或注册海外圈', '为了' + flow.reason + '，先花 30 秒验证身份。完成后会自动回到这一步。',
      '<div class="uks-seg" role="tablist" aria-label="验证方式">'
      + '<button type="button" role="tab" data-uks-mode="phone" aria-selected="' + phone + '">手机号</button>'
      + '<button type="button" role="tab" data-uks-mode="email" aria-selected="' + (!phone) + '">邮箱</button></div>'
      + '<div class="uks-field"><label for="uksContact">' + (phone ? '英国手机号' : '邮箱地址') + '</label>'
      + '<div class="uks-row"><input class="uks-input" id="uksContact" data-uks-autofocus type="' + (phone ? 'tel' : 'email') + '" autocomplete="' + (phone ? 'tel' : 'email') + '" inputmode="' + (phone ? 'tel' : 'email') + '" placeholder="' + (phone ? '07700 900123' : 'name@example.com') + '" value="' + esc(flow.contact) + '">'
      + '<button type="button" class="uks-btn" data-uks-send>' + (flow.sent ? '重新发送' : '获取验证码') + '</button></div>'
      + '<p class="uks-err" id="uksContactErr" role="alert"></p></div>'
      + '<div class="uks-field' + (flow.sent ? '' : ' hidden') + '" id="uksCodeBox"><label for="uksCode">6 位验证码</label>'
      + '<input class="uks-input" id="uksCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······">'
      + '<p class="uks-hint">演示验证码 <b>' + DEMO_CODE + '</b>（真实环境通过短信或邮件发送，5 分钟内有效）</p>'
      + '<p class="uks-err" id="uksCodeErr" role="alert"></p></div>'
      + '<div class="uks-actions"><button type="button" class="uks-btn" data-uks-close>稍后再说</button><button type="button" class="uks-btn primary" data-uks-next ' + (flow.sent ? '' : 'disabled') + '>下一步</button></div>',
      dots(1));
    Array.prototype.forEach.call(layer.querySelectorAll('[data-uks-mode]'), function(b){
      b.addEventListener('click', function(){ flow.mode = b.getAttribute('data-uks-mode'); flow.sent = false; flow.contact = ''; step1(flow); });
    });
    var contact = q('#uksContact'), code = q('#uksCode'), next = q('[data-uks-next]');
    function validContact(v){ v = String(v || '').trim(); return flow.mode === 'phone' ? /^(\+44\s?7\d{3}|07\d{3})\s?\d{3}\s?\d{3}$/.test(v) : /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
    q('[data-uks-send]').addEventListener('click', function(){
      var btn = this, v = contact.value.trim();
      q('#uksContactErr').textContent = '';
      if (!validContact(v)) { q('#uksContactErr').textContent = flow.mode === 'phone' ? '请输入英国手机号，例如 07700 900123' : '邮箱格式不正确'; contact.focus(); return; }
      busy(btn, true, '发送中…');
      setTimeout(function(){
        busy(btn, false);
        if (consumeFail()) { q('#uksContactErr').textContent = '网络不稳定，验证码没有发出，请重试。'; return; }
        flow.contact = v; flow.sent = true;
        q('#uksCodeBox').classList.remove('hidden'); btn.innerHTML = '重新发送';
        next.disabled = false; code.focus();
        toast('验证码已发送（演示：' + DEMO_CODE + '）');
      }, 600);
    });
    contact.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); q('[data-uks-send]').click(); } });
    code.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); next.click(); } });
    next.addEventListener('click', function(){
      if (code.value.trim() !== DEMO_CODE) { q('#uksCodeErr').textContent = '验证码不正确，请输入 ' + DEMO_CODE + '（演示）'; code.focus(); return; }
      var s = load(), norm = function(x){ return String(x || '').replace(/\s/g, '').replace(/^\+44/, '0'); };
      if (s.user && norm(s.user.contact) === norm(flow.contact)) {
        s.signedIn = true; save();
        finish(flow, '欢迎回来，' + s.user.name);
        return;
      }
      step2(flow);
    });
  }
  function step2(flow){
    setSheet('确认年龄与条款', '首次注册需要你确认以下事项。我们会记录确认时间与条款版本。',
      '<label class="uks-check"><input type="checkbox" id="uksAge" data-uks-req data-uks-autofocus><span>我已年满 18 岁<small>本服务面向 18 岁及以上用户；未满 18 岁暂不支持注册。</small></span></label>'
      + '<label class="uks-check"><input type="checkbox" id="uksTerms" data-uks-req><span>我已阅读并同意 <button type="button" class="uks-link" data-uks-doc="服务条款">服务条款</button> 与 <button type="button" class="uks-link" data-uks-doc="社区规范">社区规范</button></span></label>'
      + '<label class="uks-check"><input type="checkbox" id="uksPrivacy" data-uks-req><span>我已阅读 <button type="button" class="uks-link" data-uks-doc="隐私说明">隐私说明</button><small>手机号 / 邮箱只用于登录与安全验证，不公开、不用于画像。</small></span></label>'
      + '<label class="uks-check"><input type="checkbox" id="uksMkt"><span>接收活动与产品更新（可选）<small>默认不勾选，可随时在「我的 · 设置」关闭。</small></span></label>'
      + '<p class="uks-err" id="uksConsentErr" role="alert"></p>'
      + '<div class="uks-actions"><button type="button" class="uks-btn" data-uks-back>上一步</button><button type="button" class="uks-btn primary" data-uks-next disabled>同意并继续</button></div>',
      dots(2));
    var req = layer.querySelectorAll('[data-uks-req]'), next = q('[data-uks-next]');
    function sync(){ next.disabled = !Array.prototype.every.call(req, function(c){ return c.checked; }); }
    Array.prototype.forEach.call(req, function(c){ c.addEventListener('change', sync); });
    Array.prototype.forEach.call(layer.querySelectorAll('[data-uks-doc]'), function(b){ b.addEventListener('click', function(e){ e.preventDefault(); toast('演示：《' + b.getAttribute('data-uks-doc') + '》全文待法务定稿'); }); });
    q('[data-uks-back]').addEventListener('click', function(){ step1(flow); });
    next.addEventListener('click', function(){
      flow.consent = { ts: now(), version: '2026-11', age18: true, terms: true, privacy: true, marketing: !!q('#uksMkt').checked };
      step3(flow);
    });
  }
  function step3(flow){
    var lang = (typeof navigator !== 'undefined' && /TW|HK|MO|Hant/i.test(navigator.language || '')) ? 'zh-Hant' : 'zh-Hans';
    flow.tone = flow.tone || 'a';
    setSheet('设置你的资料', '昵称和头像会公开显示在你的帖子和房间里，之后可以修改。',
      '<div class="uks-field"><label for="uksName">昵称（2–20 字）</label><input class="uks-input" id="uksName" data-uks-autofocus maxlength="20" placeholder="例如：伦敦小陈"><p class="uks-err" id="uksNameErr" role="alert"></p></div>'
      + '<div class="uks-field"><span class="uks-lbl" id="uksToneLbl">头像颜色</span><div class="uks-tones" role="radiogroup" aria-labelledby="uksToneLbl">'
      + TONES.map(function(t, i){ return '<button type="button" class="uks-tone uks-av-' + t + '" role="radio" aria-checked="' + (t === flow.tone) + '" data-uks-tone="' + t + '" aria-label="头像颜色 ' + (i + 1) + '">' + esc(flow.initial || '我') + '</button>'; }).join('')
      + '</div></div>'
      + '<div class="uks-field" role="radiogroup" aria-label="简繁偏好"><span class="uks-lbl">简繁偏好</span>'
      + '<label class="uks-radio"><input type="radio" name="uksLang" value="zh-Hans" ' + (lang === 'zh-Hans' ? 'checked' : '') + '>简体中文</label>'
      + '<label class="uks-radio"><input type="radio" name="uksLang" value="zh-Hant" ' + (lang === 'zh-Hant' ? 'checked' : '') + '>繁體中文</label></div>'
      + '<div class="uks-actions"><button type="button" class="uks-btn" data-uks-back>上一步</button><button type="button" class="uks-btn primary" data-uks-next>完成注册</button></div>',
      dots(3));
    var name = q('#uksName');
    name.addEventListener('input', function(){
      flow.initial = name.value.trim().charAt(0) || '我';
      Array.prototype.forEach.call(layer.querySelectorAll('[data-uks-tone]'), function(b){ b.textContent = flow.initial; });
    });
    Array.prototype.forEach.call(layer.querySelectorAll('[data-uks-tone]'), function(b){
      b.addEventListener('click', function(){
        flow.tone = b.getAttribute('data-uks-tone');

      var nm = name.value.trim();
      if (nm.length < 2) { q('#uksNameErr').textContent = '昵称至少 2 个字'; name.focus(); return; }
      var langSel = layer.querySelector('input[name="uksLang"]:checked');
      var s = load(), t = now();
      s.user = { id: uid('u'), handle: '@user' + String(t).slice(-4), name: nm, avatar: nm.charAt(0), tone: flow.tone, contact: flow.contact,
        contactType: flow.mode, lang: langSel ? langSel.value : 'zh-Hans', city: '', joinedAt: t };
      s.signedIn = true; s.subs = []; s.roomsJoined = []; s.saved = []; s.mutedRooms = [];
      s.notifications = [{ id: uid('n'), kind: 'system', title: '注册成功，欢迎你 ' + nm, body: '关注几个频道，「正在关注」就会按时间显示它们的更新。', ts: t, unread: true }];
      s.consents.push(Object.assign({ user: s.user.handle }, flow.consent));

  function finish(flow, msg){

  /* ---------- 举报（选原因 → 提交 → 反馈） ---------- */
  var REASONS = [
    ['scam', '诈骗、虚假信息或可疑交易'], ['harass', '骚扰、仇恨或人身攻击'], ['sexual', '色情内容或未成年人风险'],

  function openReport(target, cb){
    target = target || {};
    if (!openLayer('')) return;
    var label = target.label || '这条内容';
    setSheet('举报' + (target.kindLabel || '内容'), '「' + String(label).slice(0, 40) + '」· 举报不会通知对方。',
      '<div role="radiogroup" aria-label="举报原因">'
      + REASONS.map(function(r, i){ return '<label class="uks-radio"><input type="radio" name="uksReason" value="' + r[0] + '"' + (i === 0 ? ' data-uks-autofocus' : '') + '>' + esc(r[1]) + '</label>'; }).join('')
      + '</div><div class="uks-field hidden" id="uksDetailBox"><label for="uksDetail">补充说明（必填）</label><textarea class="uks-input" id="uksDetail" maxlength="300" placeholder="说明问题所在，方便审核员判断"></textarea></div>'
      + '<p class="uks-err" id="uksReportErr" role="alert"></p>'
      + '<p class="uks-hint">' + (me() ? '可在「我的 · 我的举报」查看处理进度。' : '未登录也可以举报；登录后可查看处理进度。') + ' 违法内容 24 小时内处理（OSA 2023）。</p>'
      + '<div class="uks-actions"><button type="button" class="uks-btn" data-uks-close>取消</button><button type="button" class="uks-btn primary" data-uks-next disabled>提交举报</button></div>',
      '<span class="uks-step">' + FLAG_SVG + '</span>');
    var next = q('[data-uks-next]');
    Array.prototype.forEach.call(layer.querySelectorAll('input[name="uksReason"]'), function(r){
      r.addEventListener('change', function(){ next.disabled = false; q('#uksDetailBox').classList.toggle('hidden', r.value !== 'other'); });
    });
    next.addEventListener('click', function(){
      var picked = layer.querySelector('input[name="uksReason"]:checked'); if (!picked) return;
      var detail = (q('#uksDetail') && q('#uksDetail').value.trim()) || '';

      busy(next, true, '提交中…');
      setTimeout(function(){
        if (consumeFail()) { busy(next, false); q('#uksReportErr').textContent = '提交失败：网络异常。你的选择已保留，请重试。'; return; }
        var ticket = 'R-' + String(now()).slice(-6);
        var reasonText = REASONS.filter(function(r){ return r[0] === picked.value; })[0][1];
        var s = load();
        s.reports.unshift({ id: uid('r'), ticket: ticket, target: label, kind: target.kind || 'post', reason: reasonText, detail: detail, ts: now(), status: '已受理 · 待审核', by: me() ? me().handle : 'guest' });
        save();
        setSheet('已收到你的举报', '',
          '<div class="uks-done"><div class="uks-badge">' + CHECK_SVG + '</div>'
          + '<p class="uks-reason">原因：' + esc(reasonText) + '</p>'
          + '<p class="uks-hint">审核员会尽快处理；违法内容 24 小时内处理，结果会通过通知告诉你。在处理前，你可以屏蔽这条内容。</p>'
          + '<span class="uks-ticket">工单号 ' + esc(ticket) + '</span></div>'
          + '<div class="uks-actions"><button type="button" class="uks-btn primary" data-uks-close data-uks-autofocus>完成</button></div>');

  /* ---------- v2.1 简繁：界面文案显示层转换（PRD US-11：UGC 只在显示层转换，原文不改写；本原型对用户内容不转换） ----------
   * 偏好来源：已登录 = 账号 lang（注册第 3 屏 / 「我的 · 设置」）；游客 = prefLang。三页共用，全站生效。

    (m,p,h)=>p+`<a class="tok mention" href="#" data-search-user="${h}" aria-label="查看用户 @${h}">@${h}</a>`);
  out = out.replace(/#([\u4e00-\u9fa5A-Za-z0-9_]{1,12})/g,

/* v1.9 三层模型（Rio 2026-11-11 拍板）：
 *   ① 国际频道 region=GLOBAL：所有国家共享同一份数据，任何国家下都显示，内容一致；
 *   ② 国家频道：只属于一个已开通国家（如英国租房只属于英国），各国之间彼此隔离；
 *   ③ 房间：挂在①或②之下，可见范围跟随所属频道。

  activeRegions.clear();
  if(code && code!=='GLOBAL' && byRegion[code]) activeRegions.add(code);

  if(discoverDetailCode && !visibleChannel(byCode[discoverDetailCode])) discoverDetailCode=null;

const visibleChannel = c => {
  if(!c) return false;
  if(c.region==='GLOBAL' || c.scope==='personal') return true;
  const channelRegion=byRegion[c.region];
  if(!channelRegion || !jurisdictionIsLaunched(channelRegion.jurisdiction)) return false;
  const cur=byRegion[currentCountry()];
  return !!cur && cur.jurisdiction===channelRegion.jurisdiction;
};

function resolvePost(title){
  const key=String(title||'');
  /* 1) 种子 items（含 MEDIA） */
  let it = items.find(x=>x.title===key);
  if(it) return it;
  /* 2) 用户 store 帖子（我的动态 / 频道投稿） */
  const sp = UKCN.postsFor(p=>((p.title||String(p.text||'').slice(0,24))===key || p.id===key) && UKCN.visiblePost(p))[0];
  if(sp){
    const ch=(sp.dest==='channel'&&sp.channelCode)?byCode[sp.channelCode]:byCode['my-profile'];
    return {ch:sp.channelCode||'my-profile', time:UKCN.ago(sp.ts), title:sp.title||String(sp.text).slice(0,24), text:sp.text,
      source:'用户发布 · '+(sp.authorName||sp.author), lic:'UGC', url:'#', tags:sp.tags||[], userPost:true, postId:sp.id,
      authorName:sp.authorName, authorHandle:sp.author, authorTone:sp.authorTone,
      channelName:(ch&&ch.name)||(sp.authorName||sp.author), handle:(ch&&ch.handle)||sp.author,
      media:(sp.images&&sp.images.length)?{layout:MEDIA_LAYOUTS[Math.min(sp.images.length,4)-1],files:sp.images.map(im=>({src:im.src,name:im.alt||'用户上传图片'})),tag:'本人上传',credit:'本人原创'}:{layout:'none'}};
  }
  /* 3) 房间帖（推送到频道或示例） */
  const rp = ROOM_POSTS.find(p=>p.id===key || p.title===key);
  if(rp) return {ch:rp.parentCode||'', time:rp.time, title:rp.title, text:rp.text, tags:rp.tags||[],
    source:'房间 · '+(rp.authorName||rp.author), lic:'UGC', url:'#', authorName:rp.authorName, authorHandle:rp.author,

  return null;
}

/* v6 · X 式媒体：下滑自动播，媒体下方不设播放 / 静音按钮；点按媒体本身暂停 / 继续 */
function mediaBlockHTML(it){
  const m = it.media || {layout:'none'};
  if(m.layout==='none' || m.layout==='embed_ph') return '';
  if(Array.isArray(m.files) && m.files.length){
    const frames=m.files.map((file,i)=>'<div class="mframe'+(i?' a'+((i%3)+1):'')+'"><img class="uploaded-post-media" src="'+esc(file.src)+'" alt="'+esc(file.name||'用户上传图片')+'" loading="lazy"></div>');
    return '<div class="media media--'+esc(m.layout)+'" data-open-post="'+esc(it.title)+'" role="button" tabindex="0" aria-label="查看帖子「'+esc(it.title)+'」详情与图片"><div class="mgrid">'+frames.join('')+'</div>'+(m.tag||m.credit?'<div class="media-caption"><strong>'+esc(m.tag||'用户图片')+'</strong><span>'+esc(m.credit||'')+'</span></div>':'')+'</div>';
  }
  if(m.videoSrc){
    return '<div class="media media--landscape"><div class="mgrid"><div class="mframe"><video class="uploaded-post-media" src="'+esc(m.videoSrc)+'" controls playsinline preload="metadata" aria-label="本人原创视频"></video></div></div></div>';
  }
  const n = m.layout==='grid2' ? 2 : m.layout==='grid3' ? 3 : m.layout==='grid4' ? 4 : 1;
  const isVid = m.layout==='portrait' || m.layout==='landscape';
  const st = mediaState[it.title] || {paused:false,muted:true};
  const paused = isVid && (!autoplayFirst || st.paused);
  const frames = [];
  for(let i=0;i<n;i++){
    const alt = i ? ' a'+((i%3)+1) : '';
    frames.push('<div class="mframe'+alt+'">'
      + (isVid && m.poster ? '<img class="media-poster" src="'+esc(m.poster)+'" alt="'+esc(m.cap||'手机竖屏视频封面示意')+'" loading="lazy"><span class="media-poster-play" aria-hidden="true"><svg class="ico"><use href="#i-play"/></svg></span>' : '')
      + '<span class="mtag">'+esc(m.tag||'原创内容')+'</span>'
      + (isVid
          ? '<span class="mtag br"><svg class="ico"><use href="#i-mute"/></svg>'+esc(m.dur||'00:30')+'</span>'
          : '')
      + '<div class="mcenter"><b>'+esc(m.cap||'')+'</b>'
      + esc(n>1 ? '用户上传 · 第 '+(i+1)+' 张' : (m.credit||''))+'</div>'
      + '</div>');
  }
  const attrs = isVid
    ? (m.poster ? ' role="img" aria-label="'+esc(m.tag||'手机视频封面示意')+'，时长 '+esc(m.dur||'')+'"' : ' data-playtoggle="'+esc(it.title)+'" data-state="'+(paused?'paused':'playing')
      + '" role="button" tabindex="0" aria-label="'+esc(m.cap||'视频')+'：'
      + (paused?'已暂停，点按继续':'静音自动播放，点按暂停')+'"')
    : '';
  return '<div class="media media--'+esc(m.layout)+'"'+attrs+'><div class="mgrid">'
    + frames.join('')+'</div></div>';
}

function updateHomeComposer(){
  const body=$('#homeComposerBody');
  const count=$('#homeComposerCount');
  const submit=$('[data-compose-submit]');
  if(!body||!count||!submit)return;
  composeDraft.body=body.value;
  const n=body.value.length;
  count.textContent=n+' / 2000';
  count.classList.toggle('over',n>2000);
  let valid=n>=2 && n<=2000;
  if(composeDraft.type==='video')valid=valid&&!!composeDraft.video&&composeDraft.rights;
  if(composeDraft.type==='topic')valid=valid&&(composeDraft.topics.length>0||!!automaticCityTopic());
  if(composeDraft.type==='info')valid=valid&&composeDraft.title.trim().length>=4&&composeDraft.title.trim().length<=80;
  submit.disabled=!valid;
  if(valid&&$('#homeComposerError'))$('#homeComposerError').textContent='';
}

function renderHomeComposerAttachments(){
  const root=$('#homeComposerAttachments');
  if(!root)return;
  const imageHTML=composeDraft.images.map((image,i)=>`<div class="home-compose-attachment"><img src="${esc(image.src)}" alt="${esc(image.name)}"><button type="button" data-compose-remove-image="${i}" aria-label="移除图片 ${esc(image.name)}"><svg class="ico sm" aria-hidden="true"><use href="#i-close"/></svg></button></div>`).join('');
  const videoHTML=composeDraft.video?`<div class="home-compose-attachment"><video src="${esc(composeDraft.video.src)}" muted playsinline></video><button type="button" data-compose-remove-video aria-label="移除视频"><svg class="ico sm" aria-hidden="true"><use href="#i-close"/></svg></button></div>`:'';
  root.innerHTML=imageHTML+videoHTML;
  updateHomeComposer();
}

function selectHomeComposerType(type){
  if(!['text','video','topic','info'].includes(type))return;
  const previous=composeDraft.type;
  composeDraft.type=type;composeDraft.open=true;
  if(type==='video')composeDraft.images=[];
  if(previous==='video'&&type!=='video'){
    if(composeDraft.video?.src)URL.revokeObjectURL(composeDraft.video.src);
    composeDraft.video=null;composeDraft.rights=false;
  }
  renderForYou();$('#homeComposerBody')?.focus();updateHomeComposer();
}

function openHomeComposer(){
  composeDraft.open=true;
  const options=$('#homeComposerOptions');
  const body=$('#homeComposerBody');
  const more=$('[data-compose-advanced]');
  options&&options.classList.remove('hidden');
  more&&more.classList.add('hidden');
  if(body)body.rows=4;
}

function addHomeComposerTopic(){
  const input=$('#homeComposerTopicInput');
  const value=String(input?input.value:composeDraft.topicDraft).replace(/^#+/,'').trim().slice(0,20);
  if(!value)return;
  if(composeDraft.topics.length>=5){toast('每条内容最多添加 5 个话题');return;}
  if(composeDraft.topics.includes(value)){toast('这个话题已经添加');return;}
  composeDraft.topics.push(value);composeDraft.topicDraft='';
  renderForYou();$('#homeComposerTopicInput')?.focus();updateHomeComposer();
}

function publishHomeComposer(){
  const error=$('#homeComposerError');
  const body=$('#homeComposerBody');
  if(!body)return;
  composeDraft.body=body.value;
  const text=composeDraft.body.trim();
  let message='';
  if(text.length<2)message='写至少 2 个字再发布。';
  else if(text.length>2000)message='内容不能超过 2000 字。';
  else if(composeDraft.type==='video'&&!composeDraft.video)message='请先选择一段本人原创视频。';
  else if(composeDraft.type==='video'&&!composeDraft.rights)message='请先确认视频的原创与授权情况。';
  else if(composeDraft.type==='topic'&&!composeDraft.topics.length)message='话题帖至少添加一个话题。';
  else if(composeDraft.type==='info'&&composeDraft.title.trim().length<4)message='信息帖标题至少填写 4 个字。';
  if(message){if(error)error.textContent=message;return;}
  UKCN.requireAuth('发布内容', ()=>{
    reloadFromStore();
    if(UKCN.consumeFail()){ if(error)error.textContent='网络异常，发布失败。内容已保留，请重试。'; renderAll(); return; }
    const roomId=composeDraft.destination.indexOf('room:')===0?composeDraft.destination.slice(5):'';
    const room=roomId?myRooms.find(r=>r.id===roomId):null;
    const video=composeDraft.video;
    /* v2.1 · PRD §30.6：用户一个关键词都没填时，官方 AI（演示：本地词表）补最多 5 个，帖子上标 AI 来源，可在发布页删改 */
    const aiTags=composeDraft.topics.length?[]:UKCN.aiKeywords(composeDraft.title+' '+text,inheritedCategory(room));
    UKCN.addPost({
      dest:room?'room':'profile', roomId:room?room.id:'', roomName:room?room.name:'', parentCode:room?room.parentCode:'',
      type:composeDraft.type, title:composeDraft.title.trim(), text, category:inheritedCategory(room), source:'home',
      tags:[...new Set([...(composeDraft.topics.length?composeDraft.topics:aiTags),...(automaticCityTopic()?[automaticCityTopic()]:[])])],
      keywordSource:composeDraft.topics.length?'user':(aiTags.length?'ai_auto':'none'),
      images:composeDraft.images.slice(), videoName:video?video.name:''
    });
    if(video&&video.src)URL.revokeObjectURL(video.src);
    composeDraft.video=null;
    Object.assign(composeDraft,{open:false,type:'text',destination:'profile',body:'',title:'',category:'',topics:[],topicOpen:false,topicDraft:'',cityTopicDismissed:true,images:[],rights:false});
    renderAll();
    toast((room?'已提交到房间「'+room.name+'」· 审核中，仅你自己可见':'已提交审核 · 审核中仅你自己可见，通过后公开')+(aiTags.length?' · 官方 AI 补了 '+aiTags.length+' 个关键词（AI 建议，可删）':''));
  });
}

const FOR_YOU_BATCH_SIZE=6;
let forYouVisibleCount=FOR_YOU_BATCH_SIZE;
let forYouRanked=[];
function renderForYou(){
  /* §27 内容优先：输出仍是频道内代表内容，打分输入仍是 §26 的频道图谱；v6 只精简渲染层 */
  const pool = items.filter(i => !i.norec && visibleChannel(byCode[i.ch]) && searchMatch(i));
  const ranked = pool.map(i => ({i, s: i.score - (subs.has(i.ch) ? 0.12 : 0)}))
    .sort((a,b) => b.s - a.s).map(x => x.i);
  forYouRanked=ranked;
  const ownItems=storeProfileItems().filter(searchMatch);
  const ownPosts=ownItems.map(i=>cardHTML(i,false)).join('');
  const roomSearchResults=searchQuery?myRooms.filter(r=>roomVisibleHere(r)&&[r.name,r.id,byCode[r.parentCode]?.name||''].join(' ').toLowerCase().includes(searchQuery.replace(/^[#@]/,'').toLowerCase())):[];

function loadMoreForYou(){
  if(currentPage!=='home'||activeTab!=='foryou'||forYouVisibleCount>=forYouRanked.length)return;
  if(window.scrollY+window.innerHeight<document.documentElement.scrollHeight-500)return;
  const next=forYouRanked.slice(forYouVisibleCount,forYouVisibleCount+FOR_YOU_BATCH_SIZE);
  const list=$('#foryou-post-list');
  if(!list)return;
  list.insertAdjacentHTML('beforeend',next.map(i=>cardHTML(i,true)).join(''));
  forYouVisibleCount+=next.length;
  const state=$('#foryou-load-state');
  if(state){state.textContent=forYouVisibleCount<forYouRanked.length?'下拉加载更多动态':'';state.classList.toggle('hidden',forYouVisibleCount>=forYouRanked.length);}
}

/* PRD v1.1 §8.2：严格 added_at DESC 时间倒序；置顶公告固定在前；不做算法重排 */
function followingList(){
  return items.filter(i=>subs.has(i.ch)&&visibleChannel(byCode[i.ch]))
    .map((it,idx)=>({it,idx,age:postAgeMinutes(it.time)}))
    .sort((a,b)=>((b.it.pinned?1:0)-(a.it.pinned?1:0))||a.age-b.age||a.idx-b.idx)
    .map(x=>x.it);
}
/* v2.1 · US-03 未读分隔线：进入「正在关注」时取共享层记录的上次看到时间做快照，再把记录更新为现在；
   比快照更早的第一条非置顶内容前插「以下为上次看过」。只按时间判断，不做排序调整 */
let followSeenAt = null, followingOpen = false;
function enterFollowing(){ followSeenAt = UKCN.lastSeen('following') || Date.now(); UKCN.markSeen('following'); }
function unreadDividerAt(list){
  if(followSeenAt==null)return {at:-1,fresh:0};
  const cutoff=(Date.now()-followSeenAt)/6e4;
  const at=list.findIndex(it=>!it.pinned&&postAgeMinutes(it.time)>=cutoff);
  const fresh=list.filter(it=>!it.pinned&&postAgeMinutes(it.time)<cutoff).length;
  return {at, fresh};
}
const UNREAD_DIVIDER = (fresh)=>`<div class="unread-divider" role="separator" aria-label="以下为上次看过" data-unread-divider><span>${fresh?'':'没有新内容 · '}以下为上次看过</span></div>`;
function renderFollowing(){
  const list = followingList();
  const div = unreadDividerAt(list);
  $('#followCount').textContent = subs.size;
  $('#panel-following').innerHTML = `
    <div class="section-hint slim">严格按时间倒序 · 置顶公告在前 · 你关注的 ${subs.size} 个频道 · 无算法重排${followSeenAt!=null?` · 上次看到 ${esc(UKCN.ago(followSeenAt))}，${div.fresh} 条新内容`:''}</div>
    ${pausedNoteHTML(hiddenByCountry([...subs].map(code=>byCode[code])).length,'关注的频道')}
    ${list.length ? list.map((i,n)=>(n===div.at?UNREAD_DIVIDER(div.fresh):'')+cardHTML(i,false)).join('') :
      emptyStateHTML(UKCN.isGuest()?'登录后关注频道':'还没有关注的频道','关注后，这里按时间显示更新。',UKCN.isGuest()?'<button class="mini-btn" data-auth="关注频道">登录 / 注册</button>':'<button class="mini-btn" data-goto="add">浏览频道目录</button>')}`;
}

function setPage(page){
  currentPage=page;
  document.body.classList.toggle('publish-fab-page',['home','discover'].includes(page));
  const home=page==='home';
  /* v2.4 · 产品名「海外圈」：手机端首页标题位显示产品名（X 式品牌头），桌面仍显示「首页」，产品名在左侧品牌栏 */
  const titles={home:'首页',discover:'发现',notifications:'消息',profile:'个人主页',favorites:'收藏','my-channels':'我的房间',me:'我的'};
  if(page==='home') $('#pageTitle').innerHTML='<span class="pt-brand">海外圈</span><span class="pt-page">首页</span>'; else $('#pageTitle').textContent=titles[page]||'首页';
  document.querySelectorAll('.home-only').forEach(el=>el.classList.toggle('hidden',!home));
  $('#locBar').classList.toggle('hidden',!home);
  $('#regionBar').classList.toggle('hidden',!home);
  $('#topSearch').classList.toggle('hidden',!['home','discover'].includes(page));
  ['panel-foryou','panel-following','panel-add'].forEach(id=>$('#'+id).classList.add('hidden'));
  $('#page-view').classList.toggle('hidden',home);
  syncNav();
  if(home){switchTab(activeTab);}
  else {
    settingsOpen=false;
    if(page==='notifications')notifLoadFailed=UKCN.consumeFail();
    /* 演示加载态：浏览器里先出骨架屏，260ms 后出内容；门禁沙箱（无 requestAnimationFrame）直接渲染 */
    if(typeof requestAnimationFrame==='function'&&['notifications','me','favorites','my-channels'].includes(page)){
      pageLoading=true;renderPage();setTimeout(()=>{pageLoading=false;renderPage();restoreScroll();},260);
    } else renderPage();
    restoreScroll();
  }
}
/* v2.5 · 滚动位置记忆（MASTER §22.14）：切底栏 / 首页 Tab / 进详情前记住位置，回来停在原处；
   再点一次当前所在的底栏项 = 回到顶部（X 式）。门禁沙箱里 scrollY 恒为 0，不影响断言 */
const scrollMemory={};
let scrollTopNext=false, lastScrollY=0;
function viewKey(){return currentPage==='home'?'home:'+activeTab:currentPage+(currentPage==='notifications'?':'+msgTab+(dmView?':'+dmView.type+(dmView.id||''):''):'')+(currentPage==='profile'?':'+profileHandle:'')+(discoverDetailCode?':c:'+discoverDetailCode:'')+(listingDetailId?':l:'+listingDetailId:'');}
function rememberScroll(){scrollMemory[viewKey()]=window.scrollY||0;}
function restoreScroll(){
  const key=viewKey(), y=scrollTopNext?0:(scrollMemory[key]||0);
  const smooth=scrollTopNext; scrollTopNext=false;
  document.body.classList.remove('hdr-hide');
  lastScrollY=y;
  window.scrollTo({top:y,behavior:smooth?'smooth':'instant'});
}
/* 进入频道详情 / 分类信息详情前压栈，「返回」回到来的地方（首页、正在关注、发现……）并恢复位置 */
const detailStack=[];
function pushDetailReturn(){rememberScroll();detailStack.push({page:currentPage,tab:activeTab,code:discoverDetailCode,listing:listingDetailId});}
function popDetailReturn(){
  const r=detailStack.pop();
  if(!r){discoverDetailCode=null;listingDetailId=null;renderPage();restoreScroll();return;}
  discoverDetailCode=r.code;listingDetailId=r.listing;
  if(r.page==='home'){activeTab=r.tab;setPage('home');}
  else if(r.page===currentPage){renderPage();restoreScroll();}
  else setPage(r.page);
}
document.addEventListener('click',e=>{
  const nav=e.target.closest&&e.target.closest('.bottom [data-nav-key],.left [data-page],.left [data-goto],.tab[data-tab]');
  if(!nav)return;
  const active=nav.classList.contains('active')&&!discoverDetailCode&&!listingDetailId;
  if(active){scrollTopNext=true;scrollMemory[viewKey()]=0;}
  else{rememberScroll();detailStack.length=0;}
},true);
/* 手机端下滑收起顶栏、上滑恢复；搜索框有焦点或弹层打开时不收 */
if(typeof window.addEventListener==='function')window.addEventListener('scroll',()=>{
  loadMoreForYou();
  const y=window.scrollY||0, dy=y-lastScrollY; lastScrollY=y;
  const top=document.querySelector('.top');
  if(y<140||(top&&top.contains(document.activeElement))||UKCN.isOpen()){document.body.classList.remove('hdr-hide');return;}
  if(dy>6)document.body.classList.add('hdr-hide');
  else if(dy<-6)document.body.classList.remove('hdr-hide');
},{passive:true});
/* 底部导航 5 项：首页 / 频道 / 发现 / 通知 / 我的；收藏与我的房间收进「我的」 */
function syncNav(){
  const key=currentPage==='home'?(activeTab==='add'?'channels':'home'):(['favorites','my-channels','me'].includes(currentPage)?'me':currentPage);
  document.querySelectorAll('.bottom [data-nav-key]').forEach(b=>{const on=b.dataset.navKey===key;b.classList.toggle('active',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current');});
  /* 桌面左栏与底栏用同一套 key：收藏 / 我的房间收进「我的」后仍有选中态 */
  document.querySelectorAll('.left [data-page],.left [data-goto]').forEach(el=>{
    const on=el.dataset.goto?(key==='channels'&&el.dataset.goto==='add'):(el.dataset.page===key);
    if(el.classList.contains('nav-item')){
      el.classList.toggle('active',on);
      on?el.setAttribute('aria-current','page'):el.removeAttribute('aria-current');
    }
  });
}
function updateBadges(){
  unread=UKCN.unread();

  const all=UKCN.unreadAll();

function postAgeMinutes(value){
  const s=String(value||'');
  if(/刚刚|刚才/.test(s))return 0;
  if(/昨天|昨日/.test(s))return 1440;
  const m=s.match(/(\d+)\s*(分钟|小時|小时|天)/);
  if(!m)return 1e6;
  const n=Number(m[1]);
  return m[2]==='分钟'?n:m[2]==='天'?n*1440:n*60;
}
function renderDiscover(){
  if(listingDetailId) return renderListingDetail(findListing(listingDetailId));
  if(discoverDetailCode && byCode[discoverDetailCode]) return renderChannelDetail(byCode[discoverDetailCode]);
  const q=searchTerm.trim().toLowerCase();
  /* v1.9：自动范围 = 已确认定位且已开通的当前国家，否则国际（§33.3）；国家选项只有当前国家，不能跨国浏览别国分类 */
  const autoScope=locStage==='confirmed'&&countryDataOn()?currentCountry():'GLOBAL';
  const scope=discoveryScope==='auto'?autoScope:discoveryScope;
  const launchedCountryCodes=countryDataOn()?[currentCountry()]:[];
  const scopes=['all','GLOBAL',...launchedCountryCodes];
  const scopeChannels=channels.filter(c=>{
    if(c.region==='GLOBAL')return scope==='all'||scope==='GLOBAL';
    const jurisdiction=byRegion[c.region]?.jurisdiction;
    if(!jurisdiction||!launchedJurisdictions.has(jurisdiction)||!visibleChannel(c))return false;
    return scope==='all'||c.region===scope;
  });
  const scopeCodes=new Set(scopeChannels.map(c=>c.code));
  /* 发现页主体是内容；房间投稿仍留在频道详情与房间页，不进顶层内容流（§34 层级）。 */
  const scopedPosts=items.filter(it=>!it.norec&&scopeCodes.has(it.ch));
  const availableCategories=CHANNEL_CATEGORIES.filter(category=>scopedPosts.some(it=>byCode[it.ch]?.category===category));
  // 定位模拟等路径会改变 autoScope 却不重置分类；旧分类在新范围没有内容时回落到「全部」，避免空列表死局。
  if(discoveryCategoryFilter!=='all'&&!availableCategories.includes(discoveryCategoryFilter))discoveryCategoryFilter='all';
  const matches=scopedPosts.filter(it=>(discoveryCategoryFilter==='all'||byCode[it.ch]?.category===discoveryCategoryFilter)&&
    (!q||(it.title+it.text+(it.tags||[]).join('')+(byCode[it.ch]?.name||'')).toLowerCase().includes(q)))
    .sort((a,b)=>((b.pinned?1:0)-(a.pinned?1:0))||postAgeMinutes(a.time)-postAgeMinutes(b.time));
  const scopeLabel=scope==='all'?'全部内容':scope==='GLOBAL'?'国际内容':directoryCountryName(scope)+'内容';
  const description=scope==='all'
    ?'按地区 / 分类探索近期内容 · 不进画像；显示国际频道'+(countryDataOn()?'与'+directoryCountryName(currentCountry())+'频道':'（当前国家未开通，暂无国家频道）')+'。'
    :scope==='GLOBAL'
    ?'国际频道的近期内容 · 不进画像；各国用户看到的是同一份。'
    :`这里只显示${directoryCountryName(scope)}的内容；下方内容与频道均属于该国家，不进画像。`;
  const guest=UKCN.isGuest();
  /* v2.2（Rio 2026-11-11 批准瘦身发现页头部）：去掉登录状态条（游客预览开关移到「我的 · 设置」）；地区 + 分类合成一行横滑 chip；
     说明块只在首次进入显示一次（可关，记在共享存储 tips.discoverIntro）；标题、条数、不进画像与访客提示收成一行 12px 元信息 */
  const st=UKCN.state(); st.tips=st.tips||{};
  if(!st.tips.discoverIntro&&discoverIntroOpen===null){discoverIntroOpen=true;st.tips.discoverIntro=Date.now();UKCN.save();}
  let html=`<div class="discover-chips" role="toolbar" aria-label="内容地区与分类"><span class="dc-group" role="group" aria-label="地区">${scopes.map(code=>{const label=code==='all'?'全部地区':directoryCountryName(code);const selected=scope===code;return `<button class="page-filter ${selected?'active':''}" data-discovery-scope="${code}" aria-pressed="${selected}">${esc(label)}</button>`;}).join('')}</span><span class="dc-divider" aria-hidden="true"></span><span class="dc-group" role="group" aria-label="${esc(scopeLabel)}分类">${[['all','全部分类'],...availableCategories.map(category=>[category,category])].map(([id,label])=>`<button class="page-filter ${discoveryCategoryFilter===id?'active':''}" data-discovery-category="${id}" aria-pressed="${discoveryCategoryFilter===id}">${esc(label)}</button>`).join('')}</span></div>`;
  if(discoverIntroOpen)html+=`<div class="discover-intro" role="note"><span>${esc(description)}</span><button class="mini-btn" data-discover-intro-close aria-label="关闭说明，不再显示">知道了</button></div>`;
  html+=`<p class="discover-meta"><b class="page-heading">${esc(scopeLabel)}</b> · 近期更新 ${matches.length} 条 · 不进画像${guest?' · <span class="dm-guest">访客浏览，'+TERMS.chFollow+'、发布、查看联系方式前先轻注册</span>':''}</p>`;
  html+=matches.length?matches.map(it=>cardHTML(it,false)).join(''):
    `<div class="empty-state"><b>${q?'没有匹配的内容':'这个范围暂时没有更新'}</b><br>${q?'试试更短的关键词，或切换地区与分类。':'切换地区或分类，或去频道目录看看有哪些频道。'}<br>${discoveryCategoryFilter!=='all'?'<button class="mini-btn" data-discovery-category="all">看全部内容</button> ':''}<button class="mini-btn" data-goto="add">浏览频道目录</button></div>`;
  /* v2.1：分类信息 norec，不进上面的内容流；发现页不做个性化，PRD §36.9 允许以单独分区展示（仅当前开通国家） */
  const lst=visibleListings(l=>scopeCodes.has(l.ch)&&!listingExpired(l)&&(discoveryCategoryFilter==='all'||byCode[l.ch]?.category===discoveryCategoryFilter)&&(!q||(l.title+l.area+l.desc).toLowerCase().includes(q)));
  html+=listingSectionHTML(lst.slice(0,4),'分类信息 · '+(countryDataOn()?directoryCountryName(currentCountry()):'')+' · 单独分区，不进推荐');
  const related=scopeChannels.filter(c=>!subs.has(c.code)&&(discoveryCategoryFilter==='all'||c.category===discoveryCategoryFilter)).slice(0,3);
  if(related.length)html+=`<div class="directory-section-head"><h3>这个范围内你可能还想${TERMS.chFollow}</h3><span>${related.length} 个频道</span></div>${related.map(c=>channelRow(c,{directory:true})).join('')}`;
  return html;
}

/* 处理「消息 / 私信 / 个人主页」的点击；返回 true 表示已处理 */
function handleDMClick(e){
  const t=e.target;
  const mt=t.closest('[data-msg-tab]');
  if(mt){msgTab=mt.dataset.msgTab;dmView=null;renderPage();return true;}
  if(t.closest('[data-dm-requests]')){dmView={type:'requests'};renderPage();window.scrollTo({top:0,behavior:'instant'});return true;}
  if(t.closest('[data-dm-back]')){const d=dmView&&dmView.type==='thread'?UKCN.dmThread(dmView.id):null;dmView=d&&d.status==='request'?{type:'requests'}:null;renderPage();return true;}
  const op=t.closest('[data-dm-open]');
  if(op){openDMThread(op.dataset.dmOpen);return true;}
  const ac=t.closest('[data-dm-accept]');
  if(ac){if(UKCN.dmAccept(ac.dataset.dmAccept)){dmView={type:'thread',id:ac.dataset.dmAccept};renderPage();updateBadges();toast('已接受 · 现在可以回复了');}return true;}
  const del=t.closest('[data-dm-delete]');
  if(del){const id=del.dataset.dmDelete;UKCN.confirm({title:'删除这条消息请求？',body:'删除后对方不会收到通知；对方再发私信时会重新出现在消息请求里。不想再收到可以拉黑。',ok:'删除',danger:true},()=>{UKCN.dmDelete(id);dmView=UKCN.dmRequests().length?{type:'requests'}:null;renderPage();updateBadges();toast('已删除消息请求');});return true;}
  const bl=t.closest('[data-dm-block],[data-user-block]');
  if(bl){
    const h=bl.dataset.dmBlock||bl.dataset.userBlock;
    if(UKCN.isBlocked(h)){UKCN.unblockUser(h);renderPage();toast('已解除拉黑');return true;}
    UKCN.confirm({title:'拉黑 '+userInfo(h).name+'？',body:'拉黑后对方不能再私信你，你也看不到与对方的会话；对方不会收到通知。可在「我的 · 设置 · 私信」解除。',ok:'拉黑',danger:true},()=>{UKCN.blockUser(h);if(dmView&&dmView.type==='thread')dmView=null;renderPage();updateBadges();toast('已拉黑');});
    return true;
  }
  const rp=t.closest('[data-dm-report]');
  if(rp){const d=UKCN.dmThread(rp.dataset.dmReport);UKCN.openReport({label:'与 '+(d?userInfo(d.peer.handle).name:'对方')+' 的私信',kind:'dm',kindLabel:'私信'});return true;}
  const ur=t.closest('[data-user-report]');
  if(ur){UKCN.openReport({label:'用户 '+ur.dataset.userReport,kind:'user',kindLabel:'用户'});return true;}
  const to=t.closest('[data-dm-to]');
  if(to){if(!to.disabled)startDM(to.dataset.dmTo,to.dataset.dmName);return true;}
  const uf=t.closest('[data-user-follow]');
  if(uf){const h=uf.dataset.userFollow;const go=()=>{reloadFromStore();const on=UKCN.followUser(h);renderPage();toast(on?'已关注 · 对方的私信会直接进入私信列表':'已取消关注');};if(UKCN.isGuest()){UKCN.requireAuth('关注用户',go);return true;}go();return true;}
  const us=t.closest('[data-user]');
  if(us){openProfile(us.dataset.user);return true;}
  if(t.closest('[data-profile-back]')){closeProfile();return true;}
  if(t.closest('[data-dm-image]')){const f=$('#dmFile');if(f)f.click();return true;}
  const strangers=t.closest('[data-dm-strangers]');
  if(strangers){const on=UKCN.setDmAllowStrangers(strangers.dataset.dmStrangers==='on');renderPage();toast(on?'已允许陌生人私信：先进入消息请求':'已关闭陌生人私信：只接收你关注的人的私信');return true;}
  const ub=t.closest('[data-unblock]');
  if(ub){UKCN.unblockUser(ub.dataset.unblock);renderPage();toast('已解除拉黑');return true;}
  const sim=t.closest('[data-demo-dm]');
  if(sim){const r=UKCN.dmReceive({handle:'@newneighbor',name:'新邻居阿杰',tone:'d'},'你好，我也住在 Zone 2，周末一起去看房吗？');updateBadges();renderPage();toast({request:'阿杰（陌生人）发来私信 · 已放进消息请求',active:'阿杰发来新私信',filtered:'你已关闭陌生人私信 · 这条没有送达',blocked:'你已拉黑对方 · 没有送达'}[r]||'已模拟');return true;}
  return false;
}

function renderFavorites(){
  const savedAll=items.filter(it=>saved.has(it.title));
  const savedItems=savedAll.filter(it=>visibleChannel(byCode[it.ch]));
  const hiddenFav=savedAll.length-savedItems.length+channels.filter(c=>subs.has(c.code)&&!visibleChannel(c)).length;
  const savedChannels=channels.filter(c=>subs.has(c.code)&&visibleChannel(c)).sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  const filters=[['all','全部'],['news','新闻'],['video','视频'],['post','帖子'],['channel',TERMS.chFollow+'的频道']];
  const matches=savedItems.filter(it=>favoriteFilter==='all'||(favoriteFilter==='video'?it.media.layout!=='none':favoriteFilter==='news'?it.ch==='news':it.ch!=='news'&&it.media.layout==='none'));
  const showChannels=favoriteFilter==='all'||favoriteFilter==='channel';
  const showItems=favoriteFilter!=='channel';
  /* 语义分开：帖子=收藏、频道=关注（TERMS）。计数不再混算成「N 项收藏」。 */
  const summary=[];
  if(showItems)summary.push(`收藏的内容 ${matches.length} 条`);
  if(showChannels)summary.push(`${TERMS.chFollow}的频道 ${savedChannels.length} 个`);
  const channelMarkup=showChannels?(savedChannels.length?savedChannels.map(c=>channelRow(c,{directory:true,showRecent:true})).join(''):emptyStateHTML('还没有'+TERMS.chFollow+'的频道','在频道目录'+TERMS.chFollow+'感兴趣的频道，下次可以从这里进入。','<button class="mini-btn" data-goto="add">浏览频道目录</button>')):'';
  const itemMarkup=showItems?(matches.length?matches.map(it=>cardHTML(it,false)).join(''):emptyStateHTML('还没有收藏内容','在帖子操作栏点书签，就能在这里找回。','<button class="mini-btn" data-page="discover">去发现</button>')):'';
  return `<div class="page-toolbar" role="tablist" aria-label="收藏与关注类型">${filters.map(([id,label])=>`<button class="page-filter ${favoriteFilter===id?'active':''}" data-fav-filter="${id}" role="tab" aria-selected="${favoriteFilter===id}">${label}</button>`).join('')}</div><div class="page-description">${summary.join(' · ')}</div>${pausedNoteHTML(hiddenFav,'收藏内容或关注的频道')}${showChannels&&showItems&&savedChannels.length?'<div class="directory-section-head"><h3>'+TERMS.chFollow+'的频道</h3></div>':''}${channelMarkup}${showChannels&&showItems&&matches.length?'<div class="directory-section-head"><h3>收藏的内容</h3></div>':''}${itemMarkup}`;
}

    if(!c)return;
    if(action==='leave'){subs.delete(value);toast('已'+TERMS.chUnfollow+'「'+c.name+'」');}
    else{subs.add(value);toast('已'+TERMS.chFollow+'「'+c.name+'」· 更新会出现在「正在关注」');}
    renderAll();return;
  }
  if(kind==='room'){
    if(action==='leave'){
      roomJoined.delete(value);
      toast('已退出「'+value+'」，不再接收更新通知');
    }else{
      const newlyJoined=!roomJoined.has(value);
      roomJoined.add(value);
      if(newlyJoined){
        persist();
        UKCN.notify({kind:'room',title:'已加入房间',body:value+' · 后续更新会以摘要通知',room:value});
        unread=UKCN.unread();
      }
      toast('已加入「'+value+'」· 之后有更新会通知你');
    }
    renderAll();
  }
}

function requestJoin(kind,value){
  const alreadyJoined=kind==='channel'?subs.has(value):roomJoined.has(value);
  const action=alreadyJoined?'leave':'join';
  if(UKCN.isGuest()&&action==='join'){
    const label=kind==='channel'?(byCode[value]?.name||'频道'):value;
    /* 游客点关注 / 加入 → 3 屏轻注册；完成后回到原动作 */
    UKCN.requireAuth(kind==='channel'?TERMS.chFollow+'「'+label+'」':'加入房间「'+label+'」',()=>{reloadFromStore();completeJoin(kind,value,'join');});
    return;
  }
  completeJoin(kind,value,action);
}

function handleMeClick(e){
  const t=e.target;
  const auth=t.closest('[data-auth]');
  if(auth){UKCN.openAuth(auth.dataset.auth||'继续',afterAuth);return true;}
  if(t.closest('[data-me-edit]')){toast('演示：编辑资料页待设计（昵称、头像、城市）');return true;}
  const lang=t.closest('[data-me-lang]');
  if(lang){const l=UKCN.setLang(lang.dataset.meLang);renderPage();toast(l==='zh-Hant'?'已切换为繁体 · 全站界面生效，用户内容保持原文':'已切换为简体');return true;}
  if(t.closest('[data-me-theme]')){$('#themeBtn').click();return true;}
  if(t.closest('[data-me-export]')){
    if(exportBusy||!UKCN.me())return true;
    exportBusy=true;renderPage();
    setTimeout(()=>{
      exportBusy=false;
      if(UKCN.consumeFail()){renderPage();toast('导出失败：网络异常，请重试');return;}
      try{const blob=new Blob([UKCN.exportData()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cn-channels-my-data.json';document.body.appendChild(a);a.click();a.remove();}catch(_){}
      renderPage();toast('已生成导出文件（演示）· 真实环境会发到你的邮箱');
    },600);
    return true;
  }
  if(t.closest('[data-me-delete]')){
    if(!UKCN.me())return true;
    UKCN.confirm({title:'删除账号？',body:'将删除你的资料、帖子和房间，并退出登录。真实环境有 30 天冷静期，可联系客服撤销。',ok:'删除账号',danger:true},()=>{UKCN.deleteAccount();afterAuth();toast('账号已删除（演示）');});

  }

  if(t.closest('[data-demo-reject]')){const n=UKCN.reject();afterAuth();toast(n?'已模拟审核不通过 '+n+' 条':'没有待审核的帖子');return true;}
  if(t.closest('[data-demo-join]')){const r=UKCN.simulateJoin();afterAuth();toast(r?r.who+' 加入了「'+r.room.name+'」· 已发通知':'你还没有自己的房间');return true;}
  if(t.closest('[data-demo-fail]')){UKCN.setFailNext(!UKCN.state().demo.failNext);renderPage();toast(UKCN.state().demo.failNext?'下一次发布 / 举报 / 验证码 / 通知加载会失败':'已取消模拟网络错误');return true;}
  if(t.closest('[data-demo-reset]')){UKCN.confirm({title:'重置演示数据？',body:'清空本浏览器里的账号、房间、帖子、通知与举报，恢复默认演示账号（裴总）。',ok:'重置',danger:true},()=>{UKCN.reset();location.href='prototype-x-style.html';});return true;}
  const retry=t.closest('[data-retry]');
  if(retry){notifLoadFailed=false;renderPage();return true;}
  const rep=t.closest('[data-report]');
  if(rep){UKCN.openReport({label:rep.dataset.report,kind:'post'},()=>{if(currentPage==='me')renderPage();});return true;}
  const contact=t.closest('[data-contact]');
  if(contact){const key=contact.dataset.contact;UKCN.requireAuth('查看联系方式',()=>{reloadFromStore();contactShown.add(key);const s=UKCN.state();s.contactViews.push({title:key,ts:Date.now(),by:meHandle()});UKCN.save();renderAll();toast('已显示联系方式 · 查看记录会保留 90 天');});return true;}
  return false;
}
