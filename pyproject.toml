[project]
name = "ukcn"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pyjwt>=2.9",
  # app/embed.py 运行时就要用；只放在 dev 里会让生产镜像一导入就报 ModuleNotFoundError。
  "httpx>=0.28",
  # 对象存储（S3 协议）；只在 .env 配了 S3_ENDPOINT 时才会用到。
  "boto3>=1.35",
  # 每日 AI 资讯（app/news.py）调用 Claude。
  "anthropic>=2.8",
  # 后台两步验证的二维码（纯 Python，无其他依赖）。
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
